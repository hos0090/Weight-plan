<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ريموت الشاشة</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ريموت البيت">
<style>
:root{--bg:#0a0c13;--card:#151a28;--card2:#1f263a;--line:#2a3147;--gold:#e0b862;--gold2:#f6dea4;--txt:#f1f2f7;--mut:#8d94aa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{font-family:T,system-ui,sans-serif;background:radial-gradient(ellipse at 80% -10%,#2b2160 0,transparent 55%),radial-gradient(ellipse at 0% 110%,#0c3a4a 0,transparent 55%),var(--bg);color:var(--txt);user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none}
.top{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 12px}
.top button{background:linear-gradient(160deg,#ffffff12,#ffffff06);border:1px solid #ffffff14;border-radius:16px;padding:13px 0;font-size:20px;box-shadow:0 6px 18px -8px #000}
.top button:active,.btn:active,.k:active{background:var(--card2);transform:scale(.95)}
main{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;padding:6px 12px 10px;display:none;flex-direction:column;gap:10px}
.pane.on{display:flex}
#pad{flex:1;border-radius:26px;background:radial-gradient(circle at 50% 35%,#252c4a,#121726 70%);border:1px solid #ffffff1a;box-shadow:inset 0 0 60px #0008,0 20px 40px -20px #000;touch-action:none;position:relative;overflow:hidden}
#pad .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff30;font-size:15px;gap:6px;pointer-events:none;text-align:center;line-height:1.7}
#pad .lbl b{font-size:38px}
#dot{position:absolute;width:56px;height:56px;margin:-28px;border-radius:50%;background:#e0b86240;display:none;pointer-events:none}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:linear-gradient(160deg,#ffffff12,#ffffff06);border:1px solid #ffffff14;border-radius:18px;padding:16px 0;font-size:17px;font-weight:700;text-align:center}
.btn.gold{background:var(--gold);color:#201604}
.sens{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.sens input{flex:1;accent-color:var(--gold)}
.dpad{width:min(78vw,330px);aspect-ratio:1;margin:12px auto 0;border-radius:50%;background:radial-gradient(circle,#232a44,#121726 70%);border:1px solid #ffffff1a;box-shadow:0 20px 50px -20px #000,inset 0 0 40px #0006;position:relative}
.dpad button{position:absolute;width:33%;height:33%;font-size:30px;color:#cfd3e2;border-radius:50%}
.dpad button:active{background:#ffffff14}
.dpad .u{top:2%;left:33.5%}.dpad .d{bottom:2%;left:33.5%}.dpad .l{left:2%;top:33.5%}.dpad .r{right:2%;top:33.5%}
.dpad .ok{left:30%;top:30%;width:40%;height:40%;background:var(--gold);color:#201604;font-weight:800;font-size:22px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto;padding-bottom:10px}
.app{background:linear-gradient(160deg,#ffffff12,#ffffff06);border:1px solid #ffffff12;border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;text-align:center;min-height:96px;justify-content:center}
.app img{width:100%;height:46px;object-fit:contain}
.app .e{font-size:34px}
.app:active{transform:scale(.95);background:var(--card2)}
.sec{color:var(--mut);font-size:14px;margin-top:4px}
textarea{width:100%;min-height:90px;font:inherit;font-size:19px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--txt);outline:none;resize:none}
textarea:focus{border-color:var(--gold)}
input,textarea{-webkit-user-select:text;user-select:text}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #ffffff12;background:#0b0e18ee;padding-bottom:4px}
nav button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
nav button span{font-size:22px}
nav button.on{color:var(--gold2)}
#net{position:fixed;top:4px;left:6px;width:8px;height:8px;border-radius:50%;background:#ff5d73}
#net.on{background:#3ddc97}
.note{color:var(--mut);font-size:13px;text-align:center;line-height:1.6}
#pairV{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;background:radial-gradient(ellipse at 80% -10%,#2b2160 0,transparent 55%),var(--bg);text-align:center}
#pairV.on{display:flex}
#pairV .lg{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1d1505;font-size:34px;box-shadow:0 14px 34px -10px #e0b86280}
#pairV h1{font-size:24px;font-weight:800}
#pairV p{color:var(--mut);font-size:15px;line-height:1.8;max-width:330px}
#pcode{direction:ltr;width:260px;text-align:center;font:700 34px/1 T,system-ui;letter-spacing:10px;padding:16px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt);-webkit-user-select:text;user-select:text}
#pgo{width:260px;padding:15px;border-radius:16px;background:linear-gradient(150deg,var(--gold2),var(--gold));color:#1d1505;font-weight:800;font-size:18px}
#perr{color:#ff8a9a;min-height:22px;font-size:14px}
.lock{display:inline-flex;gap:6px;align-items:center;color:#7fd8a8;font-size:13px}
</style>
<script src="/icons.js" defer></script>
</head>
<body>
<span id="net"></span>
<div id="pairV"><div class="lg">📺</div><h1>اربط جوالك بالشاشة</h1><p>في الشاشة افتح «الإعدادات» ثم «التحكم من برا البيت» واكتب الرمز اللي يطلع لك</p><input id="pcode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"><button id="pgo">ربط</button><div id="perr"></div><span class="lock">🔒 اتصال مشفّر، والربط يتم مرة وحدة بس</span></div>
<div class="top">
  <button data-k="back" title="رجوع">↩︎</button>
  <button data-k="home" title="الرئيسية">🏠</button>
  <button data-m="play" title="تشغيل وإيقاف">⏯</button>
  <button data-v="down" title="خفض">🔉</button>
  <button data-v="up" title="رفع">🔊</button>
  <button data-v="mute" title="كتم">🔇</button>
</div>
<main>
  <section class="pane on" id="p-mouse">
    <div id="pad"><div class="lbl"><b>🖱️</b>حرّك إصبعك للمؤشر<br>لمسة = ضغطة · مطوّلة = ضغطة طويلة<br>إصبعين = تمرير</div><div id="dot"></div></div>
    <div class="mbtns"><button class="btn" id="lclick">ضغطة 👆</button><button class="btn" id="lback">رجوع ↩︎</button></div>
    <div class="sens">🐢<input type="range" id="sens" min="1" max="6" step=".5" value="2.5">🐇</div>
  </section>
  <section class="pane" id="p-keys">
    <div class="dpad">
      <button class="u" data-k="up">▲</button><button class="d" data-k="down">▼</button>
      <button class="l" data-k="left">◀</button><button class="r" data-k="right">▶</button>
      <button class="ok" data-k="ok">موافق</button>
    </div>
    <div class="mbtns"><button class="btn" data-m="rew">⏪ ترجيع</button><button class="btn" data-m="ff">تقديم ⏩</button></div>
    <div class="mbtns"><button class="btn" data-k="back">↩︎ رجوع</button><button class="btn" data-k="home">🏠 الرئيسية</button></div>
  </section>
  <section class="pane" id="p-apps">
    <div class="sec">اختصارات</div>
    <div class="apps" id="quick"></div>
    <div class="sec">تطبيقاتك</div>
    <div class="apps" id="apps"></div>
  </section>
  <section class="pane" id="p-type">
    <div class="note">وقّف على خانة الكتابة في الشاشة (مثل بحث يوتيوب)، واكتب هنا</div>
    <textarea id="tx" placeholder="اكتب هنا…"></textarea>
    <div class="mbtns"><button class="btn gold" id="send">إرسال للشاشة ✓</button><button class="btn" id="sendE">إرسال وبحث 🔍</button></div>
    <div class="mbtns"><button class="btn" id="bs">⌫ حذف حرف</button><button class="btn" data-k="back">↩︎ رجوع</button></div>
  </section>
</main>
<nav>
  <button class="on" data-p="mouse"><span>🖱️</span>ماوس</button>
  <button data-p="keys"><span>✛</span>أسهم</button>
  <button data-p="apps"><span>▦</span>تطبيقات</button>
  <button data-p="type"><span>⌨️</span>كتابة</button>
</nav>
<script>
'use strict';
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const vib = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let ws, q = [];
const RELAY = !!window.__RELAY__;
let ready = !RELAY, onApps = null;
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + (RELAY ? '/p' : '/ws'));
  ws.onopen = () => {
    if (!RELAY) { $('#net').classList.add('on'); q.splice(0).forEach((m) => ws.send(m)); return; }
    const t = LS.get('relayToken', ''); if (t) ws.send(JSON.stringify({ type: 'hello', token: t })); else $('#pairV').classList.add('on');
  };
  ws.onmessage = (e) => {
    if (!RELAY) return; let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'ready') { ready = true; $('#pairV').classList.remove('on'); $('#net').classList.add('on'); q.splice(0).forEach((x) => ws.send(x)); }
    else if (m.type === 'paired') { LS.set('relayToken', m.token); vib([20, 40, 20]); ws.send(JSON.stringify({ type: 'hello', token: m.token })); }
    else if (m.type === 'bad') $('#perr').textContent = 'الرمز غير صحيح أو انتهى، شيّك على الشاشة';
    else if (m.type === 'wait') $('#perr').textContent = 'محاولات كثيرة، انتظر ١٠ دقائق';
    else if (m.type === 'denied') { LS.set('relayToken', ''); ready = false; $('#pairV').classList.add('on'); $('#perr').textContent = 'تم إلغاء ربط هذا الجوال، اربطه من جديد'; }
    else if (m.type === 'offline') { $('#net').classList.remove('on'); $('#perr').textContent = 'الشاشة مو متصلة بالإنترنت حالياً'; }
    else if (m.type === 'apps' && onApps) onApps(m.list);
  };
  ws.onclose = () => { ready = !RELAY; $('#net').classList.remove('on'); setTimeout(connect, 1500); };
}
if (RELAY) {
  $('#pgo').onclick = () => { const c = $('#pcode').value.replace(/\D/g, ''); if (c.length !== 6) { $('#perr').textContent = 'الرمز ٦ أرقام'; return; } $('#perr').textContent = ''; if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'pair', code: c, name: /iPhone/.test(navigator.userAgent) ? 'آيفون' : 'جوال' })); };
  $('#pcode').addEventListener('input', () => { if ($('#pcode').value.replace(/\D/g, '').length === 6) $('#pgo').click(); });
}
function rc(o) { const m = JSON.stringify({ type: 'rc', ...o }); if (ws && ws.readyState === 1 && ready) ws.send(m); else if (o.cmd !== 'move') q.push(m); }
connect();

/* التبويبات */
$$('nav button').forEach((b) => (b.onclick = () => {
  $$('nav button').forEach((x) => x.classList.toggle('on', x === b));
  $$('.pane').forEach((p) => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
  LS.set('tab', b.dataset.p); vib(10);
  if (b.dataset.p === 'apps') loadApps();
}));
const lastTab = LS.get('tab', 'mouse'); $(`nav [data-p="${lastTab}"]`)?.click();

/* الأزرار مع التكرار عند الضغط المطوّل */
function hold(el, fn) {
  let t, iv;
  const start = (e) => { e.preventDefault(); fn(); vib(12); t = setTimeout(() => (iv = setInterval(fn, 110)), 420); };
  const stop = () => { clearTimeout(t); clearInterval(iv); };
  el.addEventListener('touchstart', start, { passive: false }); el.addEventListener('mousedown', start);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach((x) => el.addEventListener(x, stop));
}
$$('[data-k]').forEach((b) => { const k = b.dataset.k; if (['up', 'down', 'left', 'right'].includes(k)) hold(b, () => rc({ cmd: 'key', k })); else b.onclick = () => { vib(15); rc({ cmd: 'key', k }); }; });
$$('[data-v]').forEach((b) => { const v = b.dataset.v; if (v === 'mute') b.onclick = () => { vib(15); rc({ cmd: 'vol', v }); }; else hold(b, () => rc({ cmd: 'vol', v })); });
$$('[data-m]').forEach((b) => (b.onclick = () => { vib(15); rc({ cmd: 'media', v: b.dataset.m }); }));

/* لوحة اللمس */
const pad = $('#pad'), dot = $('#dot'), sens = $('#sens');
sens.value = LS.get('sens', 2.5); sens.oninput = () => LS.set('sens', sens.value);
let acc = { x: 0, y: 0 }, sAcc = 0, last = null, start = null, moved = 0, fingers = 0, longT = null, didLong = false, lastY = null;
setInterval(() => {
  if (Math.abs(acc.x) >= 0.5 || Math.abs(acc.y) >= 0.5) { rc({ cmd: 'move', dx: Math.round(acc.x), dy: Math.round(acc.y) }); acc = { x: 0, y: 0 }; }
  if (Math.abs(sAcc) >= 4) { rc({ cmd: 'scroll', dy: Math.round(sAcc) }); sAcc = 0; }
}, 33);
pad.addEventListener('touchstart', (e) => {
  e.preventDefault();
  fingers = e.touches.length;
  const t = e.touches[0];
  last = { x: t.clientX, y: t.clientY, t: performance.now() }; start = { ...last, at: performance.now() }; moved = 0; didLong = false;
  lastY = fingers > 1 ? (e.touches[0].clientY + e.touches[1].clientY) / 2 : null;
  dot.style.display = 'block'; dot.style.left = t.clientX - pad.getBoundingClientRect().left + 'px'; dot.style.top = t.clientY - pad.getBoundingClientRect().top + 'px';
  clearTimeout(longT);
  if (fingers === 1) { rc({ cmd: 'cursor', v: 'on' }); longT = setTimeout(() => { if (moved < 10) { didLong = true; vib([30, 40, 30]); rc({ cmd: 'long' }); } }, 650); }
}, { passive: false });
pad.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length > 1) {
    fingers = Math.max(fingers, e.touches.length);
    const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    if (lastY != null) sAcc += (y - lastY) * 1.6;
    lastY = y; moved += 20; clearTimeout(longT); return;
  }
  const t = e.touches[0], now = performance.now();
  const dx = t.clientX - last.x, dy = t.clientY - last.y, dt = Math.max(1, now - last.t);
  const speed = Math.hypot(dx, dy) / dt;
  const k = +sens.value * (1 + Math.min(3, speed * 1.4));
  acc.x += dx * k; acc.y += dy * k;
  moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 10) clearTimeout(longT);
  last = { x: t.clientX, y: t.clientY, t: now };
  const r = pad.getBoundingClientRect(); dot.style.left = t.clientX - r.left + 'px'; dot.style.top = t.clientY - r.top + 'px';
}, { passive: false });
pad.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (e.touches.length) return;
  clearTimeout(longT); dot.style.display = 'none';
  const dur = performance.now() - start.at;
  if (fingers === 1 && !didLong && moved < 12 && dur < 350) { vib(18); rc({ cmd: 'click' }); }
  fingers = 0; lastY = null;
}, { passive: false });
// للتجربة على الكمبيوتر
let md = null;
pad.addEventListener('mousedown', (e) => { md = { x: e.clientX, y: e.clientY, m: 0 }; });
addEventListener('mousemove', (e) => { if (!md) return; const dx = e.clientX - md.x, dy = e.clientY - md.y; acc.x += dx * sens.value; acc.y += dy * sens.value; md.m += Math.abs(dx) + Math.abs(dy); md.x = e.clientX; md.y = e.clientY; });
addEventListener('mouseup', () => { if (md && md.m < 5) rc({ cmd: 'click' }); md = null; });
$('#lclick').onclick = () => { vib(18); rc({ cmd: 'click' }); };
$('#lback').onclick = () => { vib(15); rc({ cmd: 'key', k: 'back' }); };

/* التطبيقات */
const QUICK = [
  { e: '🏠', t: 'الواجهة', o: { cmd: 'open', page: 'home' } },
  { e: '🎮', t: 'الألعاب', o: { cmd: 'open', page: 'games' }, go: '/play' },
  { e: '📖', t: 'القرآن', o: { cmd: 'open', page: 'quran' } },
  { e: '🍿', t: 'وضع السينما', o: null, cinema: 1 },
  { e: '🏡', t: 'الواجهة الأصلية', o: { cmd: 'stock' } },
  { e: '🌙', t: 'إطفاء الشاشة', o: { cmd: 'sleep' } }
];
$('#quick').innerHTML = QUICK.map((x, i) => `<button class="app" data-q="${i}"><span class="e">${x.e}</span>${x.t}</button>`).join('');
$$('[data-q]').forEach((b) => (b.onclick = () => {
  const x = QUICK[+b.dataset.q]; vib(20);
  if (x.cinema) { rc({ cmd: 'media', v: 'play' }); return; }
  rc(x.o); if (x.go && !RELAY) setTimeout(() => (location.href = x.go), 300);
}));
let appsLoaded = false;
async function loadApps() {
  if (appsLoaded) return;
  try {
    const list = RELAY ? await new Promise((res, rej) => { onApps = res; rc({ cmd: 'apps' }); setTimeout(() => rej(0), 8000); }) : await (await fetch('/apps.json')).json();
    const use = LS.get('use', {});
    list.sort((a, b) => (use[b.pkg] || 0) - (use[a.pkg] || 0) || a.sys - b.sys);
    $('#apps').innerHTML = list.filter((a) => !/settings|launcher|packageinstaller|webview|fdroid|activitylauncher|cvte\.factory/i.test(a.pkg))
      .map((a) => `<button class="app" data-pkg="${a.pkg}">${RELAY ? '<span class=e>📺</span>' : `<img loading="lazy" src="/icon?p=${encodeURIComponent(a.pkg)}" onerror="this.outerHTML='<span class=e>📺</span>'">`}${a.label.replace(/[<>&]/g, '')}</button>`).join('');
    $$('[data-pkg]').forEach((b) => (b.onclick = () => { vib(20); const u = LS.get('use', {}); u[b.dataset.pkg] = (u[b.dataset.pkg] || 0) + 1; LS.set('use', u); rc({ cmd: 'launch', pkg: b.dataset.pkg }); }));
    appsLoaded = true;
  } catch { $('#apps').innerHTML = '<div class="note">ما قدرت أجيب التطبيقات</div>'; }
}

/* الكتابة */
$('#send').onclick = () => { const v = $('#tx').value; if (!v) return; vib(20); rc({ cmd: 'text', v }); $('#tx').value = ''; };
$('#sendE').onclick = () => { const v = $('#tx').value; vib(20); rc({ cmd: 'text', v, enter: true }); $('#tx').value = ''; };
$('#bs').onclick = () => { vib(10); rc({ cmd: 'text', v: '\b' }); };

/* منع النوم */
(async () => { try { if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); }); } } catch {} })();
</script>
</body>
</html>
