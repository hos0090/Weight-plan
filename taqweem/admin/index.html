<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A3328">
<title>لوحة بطاقات التقويم</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--folio:#0A3328;--folio2:#11493A;--gold:#C2A061;--gold2:#E3CB98;--paper:#F7F3EA;--card:#FFFFFF;--ink:#13221D;--mut:#6A7872;--line:#E6DECD;--soft:#F4EEE2;--ok:#1C7A4E;--warn:#9A6A12;--bad:#B03A3A;
  --sh:0 1px 2px rgba(10,51,40,.05),0 6px 22px rgba(10,51,40,.07);--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0C1613;--card:#14201C;--ink:#E9F0EC;--mut:#9DB0A7;--line:#26352F;--soft:#1B2924;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
header{background:radial-gradient(1200px 300px at 85% -40%,#1C6B54 0,transparent 60%),linear-gradient(160deg,#0A3328,#0D3F32);color:#fff;padding:20px 16px 26px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
header .in,main{max-width:1150px;margin:0 auto}
header .in{display:flex;align-items:center;gap:12px}header .grow{flex:1}
header h1{margin:0;font:700 26px/1.3 'Amiri',serif;letter-spacing:.2px}header p{margin:2px 0 0;color:var(--gold2);font-size:13px;opacity:.9}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--gold),#9C7B3C);display:grid;place-items:center;color:#0A3328;font:700 22px 'Amiri',serif;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#who{display:flex;align-items:center;gap:8px}.who-n{font-size:13px;color:#CFE0D8}
main{padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:17px;margin:0}.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mut)}
input,select{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-width:0;width:100%;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,97,.18)}
.ltr{direction:ltr;text-align:left}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .1s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{box-shadow:0 2px 10px rgba(10,51,40,.1)}.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(160deg,var(--folio2),var(--folio));border-color:var(--folio);color:#fff}.btn.g{background:linear-gradient(160deg,#D2B57A,var(--gold));border-color:var(--gold);color:#22180A}
.btn.d{color:var(--bad)}.btn.dd{background:var(--bad);border-color:var(--bad);color:#fff}.btn.s{font-size:13px;padding:6px 11px}.btn:disabled{opacity:.5}.big{font-size:16px;padding:12px 20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.mt{margin-top:12px}
.err{color:var(--bad);font-weight:700;min-height:22px}.ok{color:var(--ok);font-weight:700}
.tag{display:inline-flex;align-items:center;font:inherit;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;border:0}
.fx{cursor:pointer}.t-ok{background:#DCF0E4;color:#155C3A}.t-trial{background:#F6E7C4;color:#6B4E12}.t-bad{background:#F7DADA;color:#862828}.t-off{background:var(--soft);color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:6px 0 0}
.tabs{display:flex;gap:6px;margin:-38px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh);position:relative}
.tabs button{flex:1;font:inherit;font-weight:700;font-size:15px;padding:11px;border:0;border-radius:12px;background:transparent;color:var(--mut);cursor:pointer}.tabs button.on{background:linear-gradient(160deg,var(--folio2),var(--folio));color:#fff}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.mbox{position:relative;overflow:hidden;background:linear-gradient(155deg,#11493A,#0A3328);color:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.mbox:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;border:1px solid rgba(227,203,152,.25);left:-40px;top:-50px}
.mbox span{display:block;font-size:13px;color:var(--gold2)}.mbox b{display:block;font-size:26px;margin-top:2px;letter-spacing:.3px}.mbox small{color:#B9CEC5;font-size:12px}.mbox.warn{background:linear-gradient(155deg,#6B4E12,#4A350B)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{font:inherit;text-align:center;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;box-shadow:var(--sh);transition:transform .12s}
.stat:hover{transform:translateY(-2px)}.stat.on{outline:2.5px solid var(--gold)}.stat b{display:block;font-size:24px;line-height:1.2}.stat span{font-size:12.5px;color:var(--mut)}
.stat.s-ok b{color:var(--ok)}.stat.s-bad b{color:var(--bad)}.stat.s-warn b{color:var(--warn)}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:9px 6px}.stat b{font-size:21px}}
.filters{display:flex;gap:8px;margin-bottom:12px}.filters input{flex:1}.sortS{width:auto;font-size:13px;padding:8px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.sub{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card);transition:box-shadow .15s}
.sub:hover{box-shadow:var(--sh)}.sub.off{opacity:.65}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#E9D9B4,var(--gold));color:#3B2C0C;display:grid;place-items:center;font-weight:700;font-size:15px}
.info .nm{font-weight:700;font-size:16px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:3px 0}.info .meta{color:var(--mut);font-size:12.5px}
.icons{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.ib{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:50px;padding:6px 4px;border:0;border-radius:12px;background:transparent;color:var(--folio2);cursor:pointer;transition:background .12s}
.ib span{font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap}.ib:hover{background:var(--soft)}.ib.pri{color:var(--ok)}.ib.wa{color:#1E9E55}.ib.dan{color:var(--bad)}.ib.light{color:#fff}.ib.light span{color:#CFE0D8}.ib.light:hover{background:rgba(255,255,255,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ib{color:var(--gold2)}}
@media(max-width:700px){.sub{grid-template-columns:1fr}.icons{grid-column:1/-1;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}.ib{min-width:0;flex:1}}
.acc{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}.acc .nm{font-weight:700;font-size:16px}.acc .meta{color:var(--mut);font-size:13px}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.scrim{position:fixed;inset:0;background:rgba(6,20,16,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.scrim.dlg{z-index:60}
.modal{background:var(--card);border-radius:20px;max-width:540px;width:100%;padding:20px;max-height:90vh;overflow:auto;border-top:4px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.3)}.modal.sm{max-width:420px}.modal h2{margin-bottom:12px}
.login{max-width:420px;margin:10px auto}
.plist{display:flex;flex-direction:column;gap:6px}.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--soft);border-radius:12px;padding:9px 12px}.prow .hint{grid-column:1/-1}.amt{font-weight:700;color:var(--ok)}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}.chk input{width:auto}
.lbl{font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tg button{font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.tg button.on{background:var(--folio);border-color:var(--folio);color:#fff}
.pwbox{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pwbox .lbl{margin:0}.pw{font:700 26px/1.2 ui-monospace,Menlo,monospace;letter-spacing:1px;flex:1;white-space:nowrap}
.big-in{font-size:20px;letter-spacing:1px}
.cred{display:grid;gap:10px;margin:6px 0 12px}.cred div{background:var(--soft);border-radius:14px;padding:12px;text-align:center}.cred span{display:block;font-size:13px;color:var(--mut)}.cred b{display:block;font:700 24px/1.3 ui-monospace,Menlo,monospace;letter-spacing:1px;margin-top:4px;white-space:nowrap;direction:ltr;text-align:center}
.warnbox{background:#F6E7C4;color:#5B420E;border-radius:12px;padding:10px 12px;font-weight:600}
details summary{cursor:pointer;font-weight:700;color:var(--mut)}
.addbtn{width:100%;margin-bottom:14px;font-size:18px;padding:15px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.chipb{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}.chipb.on{background:var(--folio);border-color:var(--folio);color:#fff}.chipb.on.bad{background:var(--bad);border-color:var(--bad)}.chipb.dim{opacity:.4}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.day .dhead{cursor:pointer;gap:10px}.day .dhead b{font-size:16px}
.rows{display:flex;flex-direction:column;gap:8px}.rowE{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--soft);border-radius:12px;padding:8px}.rowE.act{background:#EFE6D2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .rowE.act{background:#2A2618}}
.rowE input,.rowE select{width:auto;flex:1 1 110px;padding:7px 9px;font-size:14px}.rowE .per{flex:0 0 110px}.rowE .sec{flex:0 0 70px}.rowE .nid{flex:0 1 130px}.rowE .wide{flex:3 1 220px}.rowE .who{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 100%}.rowE .x{flex:0 0 auto;padding:4px 10px}
.rmx{color:var(--bad);text-decoration:none;margin-inline-start:4px}
.srow{display:grid;grid-template-columns:minmax(120px,auto) auto 1fr;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
@media(max-width:600px){.srow{grid-template-columns:1fr auto}.srow .hint{grid-column:1/-1}}
@media(max-width:700px){.money{grid-template-columns:1fr 1fr;gap:8px}.mbox.warn{grid-column:1/-1}.mbox{padding:12px 14px}.mbox b{font-size:20px}header h1{font-size:21px}header p{font-size:12px}}
</style></head>

  const j=await r.json().catch(()=>({}));if(!r.ok){const m=(j.error&&(j.error.message||j.error))||('HTTP '+r.status);const e=new Error(String(m));e.code=String(m);throw e}return j}
async function idTok(force){if(!force&&tok&&tok.exp>Date.now())return tok.t;const rt=ADM&&ADM.rt;if(!rt)throw new Error('LOGIN');
  const j=await post('https://securetoken.googleapis.com/v1/token?key='+FB.key,'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt),true);
  ADM.rt=j.refresh_token||rt;lsSet('tq_admin',JSON.stringify(ADM));tok={t:j.id_token,exp:Date.now()+(+j.expires_in||3600)*1000-60e3};return tok.t}
async function fs(method,path,body,retry){const t=await idTok(false);const r=await fetch(FS()+path,{method,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&!retry){tok=null;await idTok(true);return fs(method,path,body,true)}if(r.status===404)return null;
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}return j}
const V=v=>v instanceof Date?{timestampValue:v.toISOString()}:typeof v==='boolean'?{booleanValue:v}:typeof v==='number'?{integerValue:String(v)}:{stringValue:String(v)};
const F=o=>{const f={};Object.keys(o).forEach(k=>{if(o[k]!=null)f[k]=V(o[k])});return {fields:f}};
const U=f=>{const o={};Object.keys(f||{}).forEach(k=>{const x=f[k];o[k]=x.timestampValue!=null?Date.parse(x.timestampValue):x.booleanValue!=null?x.booleanValue:x.integerValue!=null?+x.integerValue:x.stringValue});return o};
const mask=o=>Object.keys(o).map(k=>'updateMask.fieldPaths='+encodeURIComponent(k)).join('&');
const hdate=ms=>ms?new Date(ms).toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}):'—';
const gdate=ms=>ms?new Date(ms).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}):'';
function daysTxt(n){return n===1?'يوم':n===2?'يومين':(n>2&&n<=10)?n+' أيام':n+' يوم'}
function status(a){if(!a.active)return ['off','موقوف','t-off'];const l=a.exp-Date.now();if(l<=0)return ['exp','منتهي','t-bad'];const d=Math.ceil(l/DAY);
  if(a.plan==='trial')return ['trial','تجربة · باقي '+daysTxt(d),'t-trial'];return [d<=30?'soon':'ok',(d<=30?'ينتهي بعد ':'فعّال · باقي ')+daysTxt(d),d<=30?'t-trial':'t-ok']}
function errTxt(e){const c=String(e.code||e.message||'');return /EMAIL_EXISTS/.test(c)?'هذا الرقم مسجّل من قبل':/OPERATION_NOT_ALLOWED|ADMIN_ONLY_OPERATION/.test(c)?'إنشاء الحسابات موقوف في فايربيس. فعّل «إنشاء الحسابات» من إعدادات الدخول.':/WEAK_PASSWORD/.test(c)?'الرقم السري قصير (٦ خانات على الأقل)':/INVALID_EMAIL/.test(c)?'اسم الدخول فيه حروف غير مسموحة':/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(c)?'اسم المستخدم أو كلمة السر غلط':/TOO_MANY/.test(c)?'محاولات كثيرة، انتظر شوي':e.status===403||/PERMISSION/.test(c)?'ما عندك صلاحية. تأكد إن قواعد الحماية الجديدة منشورة وإنك داخل بحساب المدير.':e instanceof TypeError?'ما فيه اتصال':'خطأ: '+c}
function modal(h){closeM();const s=document.createElement('div');s.className='scrim';s.id='scrim';s.innerHTML='<div class="modal">'+h+'</div>';s.addEventListener('click',e=>{if(e.target===s)closeM()});document.body.appendChild(s)}
/* نوافذ تأكيد داخل الصفحة بدل نوافذ المتصفح (بعض المتصفحات تمنعها) */
function dlg(html,btns){return new Promise(res=>{const d=document.createElement('div');d.className='scrim dlg';d.innerHTML='<div class="modal sm">'+html+'<div class="row mt" style="justify-content:flex-end">'+btns.map((b,i)=>'<button class="btn '+(b.c||'')+'" data-i="'+i+'">'+b.t+'</button>').join('')+'</div></div>';document.body.appendChild(d);
  const inp=d.querySelector('input');if(inp)setTimeout(()=>inp.focus(),30);d.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const b=btns[+x.dataset.i];d.remove();res(b.v==='input'?(inp?inp.value:''):b.v)});
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter')d.querySelector('[data-i="0"]').click()})})}
const txt=m=>'<p style="white-space:pre-line;line-height:1.8;margin:0">'+esc(m)+'</p>';
function uiConfirm(m){const danger=/حذف|إيقاف|شيل|تتراجع/.test(m);return dlg(txt(m),[{t:danger?'نعم':'تمام',v:true,c:danger?'dd':'p'},{t:'إلغاء',v:false}])}
function uiAlert(m){return dlg(txt(m),[{t:'تمام',v:true,c:'p'}])}
function uiPrompt(m){return dlg(txt(m)+'<input class="mt ltr" autocomplete="off">',[{t:'حفظ',v:'input',c:'p'},{t:'تخطي',v:''}])}
function closeM(){const s=$('#scrim');if(s)s.remove()}
/* ---------- خزنة كلمات السر: تنقفل بالمفتاح العام، وما تنفتح إلا بالعبارة السرية ---------- */
function sealPw(pw){const e=nacl.box.keyPair(),n=nacl.randomBytes(24);return b64e(cat(e.publicKey,n,nacl.box(enc(pw),n,PK,e.secretKey)))}
function openPw(c){const u=b64d(c),o=nacl.box.open(u.slice(56),u.slice(32,56),u.slice(0,32),SK);return o?dec(o):null}
async function savePw(email,pw){if(!PK||!pw)return;await fs('PATCH','/vault/'+encodeURIComponent(email),F({c:sealPw(pw),u:new Date()}))}
function askPhrase(then){if(SK)return then();modal('<h2>العبارة السرية</h2><p class="hint" style="margin-top:0">اكتب عبارتك السرية عشان تظهر كلمات السر.</p><input id="phI" type="password" autocomplete="off"><p class="err" id="phE"></p><div class="row"><button class="btn p big" id="phGo">فتح</button><button class="btn" onclick="closeM()">إلغاء</button></div>');
  $('#phI').focus();$('#phI').addEventListener('keydown',e=>{if(e.key==='Enter')$('#phGo').click()});
  $('#phGo').onclick=async()=>{$('#phGo').disabled=true;$('#phE').textContent='لحظة…';try{const d=await fs('GET','/admin/escrow');const o=U(d.fields),w=b64d(o.w);await new Promise(r=>setTimeout(r,20));
    const sk=nacl.secretbox.open(w.slice(24),w.slice(0,24),kdf($('#phI').value,b64d(o.s),o.it||60000));if(!sk){$('#phGo').disabled=false;return $('#phE').textContent='العبارة غلط'}SK=sk;closeM();then()}catch(e){$('#phGo').disabled=false;$('#phE').textContent=errTxt(e)}}}
function vSetup(){$('#main').innerHTML='<div class="card login" style="max-width:520px"><h2>خطوة وحدة قبل البداية</h2><p>اختر <b>عبارة سرية للمدير</b>. فيها تنقفل كلمات سر كل المشتركين، وما تنفتح إلا فيها، عشان لو أحد نسي كلمة سره تشوفها وترسلها له.</p><p class="warnbox">اكتبها على ورقة واحفظها عندك. لو ضاعت ما أحد يقدر يرجعها.</p><label>العبارة السرية (١٠ خانات على الأقل)<input id="s1" type="password" autocomplete="new-password"></label><label style="margin-top:10px">أعد كتابتها<input id="s2" type="password" autocomplete="new-password"></label><p class="err" id="sE"></p><button class="btn p big" id="sGo" style="width:100%">حفظ</button></div>';
  $('#sGo').onclick=async()=>{const a=$('#s1').value,b=$('#s2').value;if(a.length<10)return $('#sE').textContent='على الأقل ١٠ خانات';if(a!==b)return $('#sE').textContent='الكتابتين مو نفس بعض';
    $('#sGo').disabled=true;$('#sE').textContent='لحظة…';await new Promise(r=>setTimeout(r,20));
    try{const kp=nacl.box.keyPair(),salt=nacl.randomBytes(16),n=nacl.randomBytes(24),it=60000;
      await fs('PATCH','/admin/escrow?currentDocument.exists=false',F({pk:b64e(kp.publicKey),w:b64e(cat(n,nacl.secretbox(kp.secretKey,n,kdf(a,salt,it)))),s:b64e(salt),it}));
      await fs('PATCH','/pub/admin',F({pk:b64e(kp.publicKey)}));PK=kp.publicKey;SK=kp.secretKey;load()}catch(e){$('#sGo').disabled=false;$('#sE').textContent=errTxt(e)}}}

/* ---------- الدخول ---------- */
function vLogin(msg){$('#who').innerHTML='';$('#main').innerHTML='<div class="card login"><h2>دخول المدير</h2><label>اسم المستخدم<input id="lu" class="ltr" autocomplete="username" value="hussam"></label><label style="margin-top:10px">كلمة السر<input id="lp" class="ltr" type="password" autocomplete="current-password"></label><p class="err" id="le">'+esc(msg||'')+'</p><button class="btn p big" id="lg" style="width:100%">دخول</button></div>';
  $('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#lg').click()});
  $('#lg').onclick=async()=>{const u=$('#lu').value,p=$('#lp').value;if(!u||!p)return;$('#lg').disabled=true;$('#le').textContent='لحظة…';
    try{const j=await post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.key,{email:emailOf(u),password:p,returnSecureToken:true});
      if(!/^hussam@/.test(emailOf(u))){$('#lg').disabled=false;$('#le').innerHTML='هذا حساب موظف. يدخل من التطبيق: <a href="../">افتح التطبيق</a>';return}ADM={u:emailOf(u),rt:j.refreshToken};tok={t:j.idToken,exp:Date.now()+(+j.expiresIn||3600)*1000-60e3};lsSet('tq_admin',JSON.stringify(ADM));await load()}
    catch(e){$('#lg').disabled=false;$('#le').textContent=errTxt(e)}}}
function logout(){ADM=null;tok=null;SK=null;PK=null;lsSet('tq_admin',null);vLogin()}

/* ---------- القائمة ---------- */
async function load(){$('#main').innerHTML='<div class="card">لحظة…</div>';
  try{if(!PK){const e=await fs('GET','/admin/escrow');if(!e){$('#who').innerHTML='<button class="btn s hbtn" onclick="logout()">خروج</button>';return vSetup()}PK=b64d(U(e.fields).pk)}
    const out=[];let pt='';do{const j=await fs('GET','/accounts?pageSize=300'+(pt?'&pageToken='+encodeURIComponent(pt):''));((j&&j.documents)||[]).forEach(d=>{const o=U(d.fields);o.email=decodeURIComponent(d.name.split('/').pop());out.push(o)});pt=j&&j.nextPageToken}while(pt);
    out.forEach(a=>{try{a.pays=JSON.parse(a.payLog||'[]')}catch(e){a.pays=[]}});ACC=out.sort((a,b)=>(b.created||0)-(a.created||0));
    try{const st=await fs('GET','/admin/settings');if(st){const o=U(st.fields);if(+o.price>0)PRICE=+o.price}}catch(e){}view()}
  catch(e){if(e.message==='LOGIN'||/INVALID_REFRESH|TOKEN_EXPIRED|USER_NOT_FOUND/.test(e.code||''))return vLogin();$('#main').innerHTML='<div class="card"><p class="err">'+esc(errTxt(e))+'</p><button class="btn" onclick="load()">إعادة المحاولة</button> <button class="btn" onclick="logout()">خروج</button></div>'}}
/* ---------- أيقونات ---------- */

 plus7:I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),key:I('<circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3m-4 4 2.5 2.5M14 9l2 2"/>'),send:I('<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>'),

 trash:I('<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>'),out:I('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>'),undo:I('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>')};
const ib=(ic,t,fn,cls)=>'<button class="ib'+(cls?' '+cls:'')+'" onclick="'+fn+'" title="'+t+'" aria-label="'+t+'">'+IC[ic]+'<span>'+t+'</span></button>';
/* ---------- الدفع ---------- */
const SAR=n=>Number(n||0).toLocaleString('ar-SA-u-nu-latn')+' ريال';
function curPay(a){return (a.pays||[]).filter(p=>p.u>=a.exp-2*DAY).sort((x,y)=>y.d-x.d)[0]}
function pay(a){if(a.free)return ['free','مجاني','t-off'];
  if(a.plan==='trial')return [status(a)[0]==='exp'?'due':'trial',status(a)[0]==='exp'?'انتهت تجربته':'في التجربة','t-trial'];
  const c=curPay(a);if(c)return ['paid','دفع '+SAR(c.a),'t-ok'];return ['due','ما دفع','t-bad'];}
const allPays=()=>ACC.flatMap(a=>(a.pays||[]).map((p,k)=>Object.assign({who:a.name||a.user,email:a.email,k},p))).sort((x,y)=>y.d-x.d);
const ini=n=>String(n||'؟').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('\u200c');
function view(){TAB='acc';$('#who').innerHTML='<span class="who-n">'+esc((ADM&&ADM.u||'').split('@')[0])+'</span>'+ib('out','خروج','logout()','light');
  const st=ACC.map(status),ps=ACC.map(pay),n=k=>st.filter(x=>x[0]===k).length,np=k=>ps.filter(x=>x[0]===k).length;
  const P=allPays(),now=new Date(),mStart=+new Date(now.getFullYear(),now.getMonth(),1),total=P.reduce((x,p)=>x+(+p.a||0),0),month=P.filter(p=>p.d>=mStart).reduce((x,p)=>x+(+p.a||0),0);
  const dueL=ACC.filter((a,i)=>ps[i][0]==='due'||ps[i][0]==='trial'),expect=dueL.reduce((x,a)=>x+(+a.price||PRICE),0);
  const card=(f,v,t,cls)=>'<button class="stat'+(cls?' '+cls:'')+(FIL===f?' on':'')+'" data-f="'+f+'"><b>'+v+'</b><span>'+t+'</span></button>';
  let h=tabs();
  h+='<div class="money"><div class="mbox"><span>الدخل الكلي</span><b>'+SAR(total)+'</b><small>'+P.length+' دفعة</small></div><div class="mbox"><span>دخل هالشهر</span><b>'+SAR(month)+'</b><small>'+now.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long'})+'</small></div><div class="mbox warn"><span>متوقع من اللي ما دفعوا</span><b>'+SAR(expect)+'</b><small>'+dueL.length+' شخص</small></div></div>';
  h+='<div class="stats">'+card('all',ACC.length,'الكل')+card('paid',np('paid'),'دفعوا','s-ok')+card('due',np('due'),'ما دفعوا','s-bad')+card('trial',n('trial'),'تجربة','s-warn')+card('soon',n('soon'),'قرب ينتهي','s-warn')+card('off',n('exp')+n('off'),'منتهي/موقوف')+'</div>';
  h+='<div class="card"><div class="lhead"><h2>المشتركين'+(FIL!=='all'?' <button class="tag t-off fx" onclick="FIL=\'all\';view()">'+esc({paid:'دفعوا',due:'ما دفعوا',trial:'تجربة',soon:'قرب ينتهي',off:'منتهي/موقوف'}[FIL]||'')+' ✕</button>':'')+'</h2><button class="btn g" onclick="vNew()">+ موظف</button></div><div class="filters"><input id="q" placeholder="بحث بالاسم أو الجوال أو الفريق" value="'+esc(Q)+'"><select id="sortS" class="sortS"><option value="new">الأحدث</option><option value="exp">الأقرب انتهاء</option><option value="name">الاسم</option><option value="team">الفريق</option></select></div><div class="list" id="lst"></div></div>';
  h+='<div class="card"><div class="lhead"><h2>سجل الدفعات</h2></div><div id="payLst" class="plist">'+(P.length?P.slice(0,PAYN).map(p=>'<div class="prow"><b>'+esc(p.who)+'</b><span class="row" style="gap:4px"><span class="amt">'+SAR(p.a)+'</span>'+ib('trash','حذف','undoPay('+ACC.findIndex(x=>x.email===p.email)+','+p.k+')','dan')+'</span><span class="hint" style="margin:0">'+gdate(p.d)+'م'+(p.m?' · '+esc(p.m):'')+(p.n?' · '+esc(p.n):'')+'</span></div>').join('')+(P.length>PAYN?'<button class="btn s" onclick="PAYN+=20;view()">عرض المزيد</button>':''):'<p class="hint">ما سجلت أي دفعة بعد.</p>')+'</div></div>';
  h+='<div class="card"><div class="lhead"><h2>السعر السنوي</h2></div><div class="row"><input id="prI" type="number" inputmode="numeric" value="'+PRICE+'" style="max-width:140px"><span>ريال</span><button class="btn" id="prS">حفظ</button><span class="hint" id="prM" style="margin:0"></span></div></div>';
  $('#main').innerHTML=h;$('#sortS').value=SORT;list();
  $('#q').oninput=e=>{Q=e.target.value;list()};$('#sortS').onchange=e=>{SORT=e.target.value;list()};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FIL=FIL===b.dataset.f?'all':b.dataset.f;view()});
  $('#prS').onclick=async()=>{const v=Math.round(+$('#prI').value);if(!(v>0))return;try{await fs('PATCH','/admin/settings',F({price:v}));PRICE=v;$('#prM').textContent='انحفظ ✓';view()}catch(e){$('#prM').textContent=errTxt(e)}}}
let PAYN=10,SORT='new';
function match(a){const s=status(a)[0],p=pay(a)[0];if(FIL==='all')return true;if(FIL==='paid'||FIL==='due')return p===FIL;if(FIL==='off')return s==='exp'||s==='off';return s===FIL}
function list(){const q=digits(Q).trim();let L=ACC.filter(a=>match(a)&&(!q||[a.name,a.team,a.user,a.phone,a.email].join(' ').indexOf(q)>=0));
  L=L.slice().sort(SORT==='exp'?(x,y)=>(x.exp||0)-(y.exp||0):SORT==='name'?(x,y)=>String(x.name).localeCompare(String(y.name),'ar'):SORT==='team'?(x,y)=>String(x.team).localeCompare(String(y.team),'ar')||String(x.name).localeCompare(String(y.name),'ar'):(x,y)=>(y.created||0)-(x.created||0));
  $('#lst').innerHTML=L.length?L.map(a=>{const s=status(a),p=pay(a),i=ACC.indexOf(a),remind=a.phone&&(p[0]==='due'||s[0]==='soon'||a.plan==='trial');
    return '<div class="sub'+(a.active?'':' off')+'"><div class="info"><div class="nm">'+esc(a.name||a.user)+'</div><div class="pills"><span class="tag '+s[2]+'">'+esc(s[1])+'</span><button class="tag '+p[2]+' fx" onclick="vPays('+i+')" title="الدفعات">'+esc(p[1])+'</button>'+(a.role==='coord'?'<span class="tag t-off">منسق</span>':'')+'</div><div class="meta"><span class="ltr">'+esc(a.user||a.email)+'</span>'+(a.team?' · '+esc(a.team):'')+' · ينتهي '+esc(hdate(a.exp))+'</div></div>'+
    '<div class="icons">'+ib('pay','دفعة','vPay('+i+')','pri')+(remind?ib('wa','تذكير','remind('+i+')','wa'):'')+(a.plan==='trial'?ib('plus7','+أسبوع','extend('+i+',7)'):'')+ib('key','الرقم','showPw('+i+')')+ib('send','الرسالة','share('+i+')')+ib('edit','تعديل','vEdit('+i+')')+ib(a.active?'pause':'play',a.active?'إيقاف':'تفعيل','toggle('+i+')')+ib('trash','حذف','del('+i+')','dan')+'</div></div>'}).join(''):'<p class="hint">ما فيه أحد'+(ACC.length?' هنا':' بعد. اضغط «+ موظف».')+'</p>'}

  $('#main').innerHTML=h;
  $('#vS').onchange=e=>{v.school=e.target.value.trim();touchV()};$('#vG').onchange=e=>{v.stage=e.target.value;touchV();vSch()};
  $('#xAdd').onclick=()=>{const a=$('#mA').value,n=$('#xN').value.trim();v.mem=v.mem||[];if(a&&!v.mem.includes(a))v.mem.push(a);if(n&&!v.mem.includes('x:'+n))v.mem.push('x:'+n);touchV();vSch()};
  $('#mA').onchange=()=>$('#xAdd').click();
  document.querySelectorAll('.rmx').forEach(x=>x.onclick=async e=>{e.preventDefault();const m=x.dataset.x;if(!await uiConfirm('شيل '+nm(m)+' من الزيارة؟ حصصه بتصير بدون عضو.'))return;v.mem=v.mem.filter(y=>y!==m);v.days.forEach(d=>d.rows.forEach(r=>r.m=(r.m||[]).filter(y=>y!==m)));if(v.sup===m)v.sup='';touchV();vSch()});
  if($('#supS')){$('#supS').onchange=e=>{v.sup=e.target.value;touchV()};$('#supJ').onchange=e=>{v.supJoin=e.target.checked;touchV()};
    $('#rAdd').onclick=()=>{const s=$('#rS').value.trim(),m=$('#rM').value;if(!s||!m)return;v.rules=v.rules||[];v.rules.push({s,m});touchV();vSch()}}
  bindDays()}

async function delVisit(){const v=CV();if(!await uiConfirm('حذف زيارة «'+(v.school||'')+'» بكل أيامها؟'+(v.pubAt?'\nبعد الحذف اضغط «اعتماد ونشر» في أي زيارة لنفس الأعضاء عشان تنشال من عندهم، أو أنا أنشر عنك.':'')))return;

function dayCard(d,i){const ms=members(),open=OPEN[d.id]!==false,nC=d.rows.filter(r=>r.t==='v').length;
  let h='<div class="card day"><div class="row dhead" onclick="OPEN[\''+d.id+'\']='+(!open)+';vSch()"><b>'+esc(dayName(d.g)||'يوم')+' '+esc(hTxt(d.g))+(d.g?'هـ':'')+'</b><span class="grow"></span><span class="hint" style="margin:0">'+nC+' حصة</span><span>'+(open?'▲':'▼')+'</span></div>';

  return h}
function rowEd(d,i,r,j,ms){const grades=GR[CV().stage]||GR['ابتدائي'],ab=d.absent||[];
  let h='<div class="rowE '+(r.t==='a'?'act':'')+'"><select data-r="'+i+'.'+j+'" data-k="p" class="per">'+PERIODS.map(p=>'<option'+(r.p===p?' selected':'')+'>'+p+'</option>').join('')+'</select>';
  if(r.t==='v')h+='<input data-r="'+i+'.'+j+'" data-k="subject" list="subjL" placeholder="المادة" value="'+esc(r.subject||'')+'"><select data-r="'+i+'.'+j+'" data-k="grade"><option value="">الصف</option>'+grades.map(g=>'<option'+(r.grade===g?' selected':'')+'>'+g+'</option>').join('')+'</select><input data-r="'+i+'.'+j+'" data-k="section" placeholder="الفصل" value="'+esc(r.section||'')+'" class="sec"><input data-r="'+i+'.'+j+'" data-k="teacher" placeholder="المعلم" value="'+esc(r.teacher||'')+'"><input data-r="'+i+'.'+j+'" data-k="nid" placeholder="السجل المدني" class="ltr nid" inputmode="numeric" value="'+esc(r.nid||'')+'">';
  else h+='<input data-r="'+i+'.'+j+'" data-k="text" list="actL" placeholder="النشاط" value="'+esc(r.text||'')+'" class="wide">';
  h+='<button class="btn s d x" onclick="delRow('+i+','+j+')">✕</button><div class="who">'+(r.t==='a'?'<button class="chipb'+((r.m||[]).includes('*')?' on':'')+'" data-w="'+i+'.'+j+'" data-m="*">كامل الفريق</button>':'')+ms.map(a=>'<button class="chipb'+((r.m||[]).includes(a.email)?' on':'')+(ab.includes(a.email)?' dim':'')+'" data-w="'+i+'.'+j+'" data-m="'+esc(a.email)+'">'+esc(short(a.email))+'</button>').join('')+(ms.length?'':'<span class="hint" style="margin:0">أضف أعضاء الزيارة فوق</span>')+'</div></div>';
  return h}
function bindDays(){const v=CV();
  document.querySelectorAll('[data-d]').forEach(el=>el.onchange=()=>{v.days[+el.dataset.d][el.dataset.k]=el.value;touchV();vSch()});
  document.querySelectorAll('[data-r]').forEach(el=>{const f=()=>{const [i,j]=el.dataset.r.split('.').map(Number),r=v.days[i].rows[j];let x=el.value;if(el.dataset.k==='nid')x=digits(x).replace(/\D/g,'');r[el.dataset.k]=x;touchV();$('#sumC').innerHTML=summary()};el.onchange=f;if(el.tagName==='INPUT')el.oninput=()=>{clearTimeout(el._t);el._t=setTimeout(f,500)}});
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.w.split('.').map(Number),r=v.days[i].rows[j],m=b.dataset.m;r.m=r.m||[];
    if(m==='*')r.m=r.m.includes('*')?[]:['*'];else{r.m=r.m.filter(x=>x!=='*');r.m=r.m.includes(m)?r.m.filter(x=>x!==m):r.m.concat([m])}touchV();vSch()});
  document.querySelectorAll('[data-abs]').forEach(b=>b.onclick=()=>{const d=v.days[+b.dataset.abs],m=b.dataset.m;d.absent=d.absent||[];d.absent=d.absent.includes(m)?d.absent.filter(x=>x!==m):d.absent.concat([m]);touchV();vSch()})}
function addDay(quiet){const v=CV(),last=v.days[v.days.length-1];let g='';if(last&&last.g){const t=new Date(last.g+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);g=t.toISOString().slice(0,10)}
  const d={id:rid(),g,absent:[],rows:[{id:rid(),t:'a',p:'الطابور',text:'حضور الطابور',m:['*']}]};v.days.push(d);OPEN[d.id]=true;if(!quiet){touchV();vSch()}}
function dupDay(i){const v=CV(),d=JSON.parse(JSON.stringify(v.days[i]));d.id=rid();d.rows.forEach(r=>r.id=rid());if(d.g){const t=new Date(d.g+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);d.g=t.toISOString().slice(0,10)}v.days.splice(i+1,0,d);touchV();vSch()}
async function delDay(i){if(!await uiConfirm('حذف يوم '+(hTxt(CV().days[i].g)||'')+' بكل حصصه؟'))return;CV().days.splice(i,1);touchV();vSch()}
function addRow(i,t){const d=CV().days[i],last=d.rows.filter(r=>r.t==='v').slice(-1)[0],ms=members();d.rows.push(t==='v'?{id:rid(),t,p:last?last.p:'الأولى',subject:'',grade:'',section:'',teacher:'',nid:'',m:ms.length===1?[ms[0].email]:[]}:{id:rid(),t,p:'الخامسة',text:'',m:ms.length===1?[ms[0].email]:[]});touchV();vSch()}
function delRow(i,j){CV().days[i].rows.splice(j,1);touchV();vSch()}
function summary(){const v=CV(),ms=members();if(!ms.length)return '<p class="hint">أضف أعضاء الزيارة.</p>';const L=ms.map(a=>{const per=v.days.map(d=>d.rows.filter(r=>r.t==='v'&&(r.m||[]).includes(a.email)));const n=per.reduce((x,y)=>x+y.length,0);
    const subs={};per.flat().forEach(r=>{const k=(r.subject||'').trim();if(k)subs[k]=(subs[k]||0)+1});const rep=Object.keys(subs).filter(k=>subs[k]>1);
    return '<div class="srow"><b>'+esc(a.name)+'</b><span>'+n+' حصة</span><span class="hint" style="margin:0">'+per.map((x,k)=>esc(dayName(v.days[k].g)||('يوم '+(k+1)))+': '+x.length).join(' · ')+(rep.length?' · <span style="color:var(--warn)">تكرار: '+esc(rep.join('، '))+'</span>':'')+'</span></div>'});
  const un=v.days.reduce((x,d)=>x+d.rows.filter(r=>r.t==='v'&&!(r.m||[]).length).length,0);
  return '<h2>حصص كل عضو</h2>'+L.join('')+(un?'<p class="err">'+un+' حصة بدون عضو</p>':'')}

/* ---------- التوزيع التلقائي ---------- */
async function autoDist(){const v=CV(),ms=(v.mem||[]);if(ms.length<2)return;
  const C=[];v.days.forEach((d,di)=>d.rows.forEach(r=>{if(r.t==='v')C.push({di,r})}));if(!C.length)return uiAlert('أضف الحصص أول');
  if(C.some(c=>(c.r.m||[]).length)&&!await uiConfirm('فيه حصص موزعة. التوزيع التلقائي يعيد توزيع كل حصص الزيارة. تكمل؟'))return;
  const res=solve(C,ms);if(!res)return uiAlert('ما قدرت ألقى توزيع يمشي على الشروط. تأكد إن الحصص بنفس الوقت ما تزيد عن عدد الحاضرين.');
  C.forEach((c,k)=>{c.r.m=[res.a[k]].concat(res.J.filter(x=>x.k===k).map(()=>v.sup))});touchV();saveSD(true);vSch();
  uiAlert('انوزعت '+C.length+' حصة.'+(res.notes.length?'\n\nملاحظات:\n• '+res.notes.join('\n• '):''))}
function busy(di,p,who){return CV().days[di].rows.some(r=>r.t==='a'&&r.p===p&&(r.m||[]).includes(who))}
function solve(C,ms){const v=CV(),sup=v.sup&&ms.includes(v.sup)?v.sup:'',others=ms.filter(m=>m!==sup),rules=v.rules||[],D=v.days;
  const allow=C.map(c=>{const ab=D[c.di].absent||[];const rl=rules.find(x=>x.s&&(c.r.subject||'').indexOf(x.s)>=0&&ms.includes(x.m));
    let A=ms.filter(m=>!ab.includes(m)&&!busy(c.di,c.r.p,m));if(rl&&A.includes(rl.m))A=[rl.m];return A});
  if(allow.some(a=>!a.length))return null;
  const slot=k=>C[k].di+'|'+C[k].r.p,days=D.map((d,i)=>i).filter(i=>C.some(c=>c.di===i));
  function joins(a){if(!sup||!v.supJoin)return [];const used=new Set(C.map((c,k)=>a[k]===sup?slot(k):null).filter(Boolean)),J=[];
    for(const o of others){let best=null,bs=1e9;C.forEach((c,k)=>{if(a[k]!==o||used.has(slot(k)))return;if((D[c.di].absent||[]).includes(sup)||busy(c.di,c.r.p,sup))return;
        let s=0;C.forEach((c2,k2)=>{if(a[k2]===sup&&(c2.r.subject||'')===(c.r.subject||''))s+=10;if(a[k2]===sup&&c2.r.teacher&&c2.r.teacher===c.r.teacher)s+=50});J.forEach(j=>{if(C[j.k].r.subject===c.r.subject)s+=10});if(J.some(j=>C[j.k].di===c.di))s+=1;
        if(s<bs){bs=s;best=k}});if(best!=null){J.push({k:best,o});used.add(slot(best))}}return J}
  function score(a){let s=0;const J=joins(a),load={},seen={};ms.forEach(m=>{load[m]=0;seen[m]={s:{},t:{},c:{},slot:{},day:{}}});
    const put=(m,k)=>{const c=C[k],r=c.r,x=seen[m];load[m]++;const sl=slot(k);if(x.slot[sl])s+=1000;x.slot[sl]=1;const sb=(r.subject||'').trim();if(sb){if(x.s[sb])s+=10;x.s[sb]=1}
      const t=(r.nid||r.teacher||'').trim();if(t){if(x.t[t])s+=60;x.t[t]=1}const cl=(r.grade||'')+(r.section||'');if(cl){if(x.c[cl])s+=1;x.c[cl]=1}x.day[c.di]=1};
    C.forEach((c,k)=>put(a[k],k));J.forEach(j=>put(sup,j.k));
    if(sup&&v.supJoin)s+=30*(others.length-J.length);
    const L=Object.values(load);s+=8*(Math.max(...L)-Math.min(...L));
    ms.forEach(m=>days.forEach(di=>{if(!seen[m].day[di]&&!(D[di].absent||[]).includes(m))s+=6}));
    return {s,J}}
  let best=null;const t0=Date.now();
  for(let it=0;it<400&&Date.now()-t0<2500;it++){const a=allow.map(A=>A[Math.floor(Math.random()*A.length)]);let cur=score(a).s;
    for(let step=0;step<C.length*30;step++){const k=Math.floor(Math.random()*C.length);if(Math.random()<.5){const A=allow[k],old=a[k];a[k]=A[Math.floor(Math.random()*A.length)];const ns=score(a).s;if(ns<=cur)cur=ns;else a[k]=old}
      else{const k2=Math.floor(Math.random()*C.length);if(!allow[k].includes(a[k2])||!allow[k2].includes(a[k]))continue;[a[k],a[k2]]=[a[k2],a[k]];const ns=score(a).s;if(ns<=cur)cur=ns;else[a[k],a[k2]]=[a[k2],a[k]]}}
    if(!best||cur<best.s)best={s:cur,a:a.slice()}}
  const sc=score(best.a);if(sc.s>=1000)return null;const notes=[];
  const per={};ms.forEach(m=>per[m]={});C.forEach((c,k)=>{const sb=c.r.subject;per[best.a[k]][sb]=(per[best.a[k]][sb]||0)+1});sc.J.forEach(j=>{const sb=C[j.k].r.subject;per[sup][sb]=(per[sup][sb]||0)+1});
  ms.forEach(m=>Object.keys(per[m]).forEach(sb=>{if(per[m][sb]>1)notes.push(short(m)+' يحضر '+sb+' '+per[m][sb]+' مرات (ما فيه توزيع أفضل)')}));
  if(sup&&v.supJoin&&sc.J.length<others.length)notes.push('المشرف ما قدر يحضر مع الكل');
  return {a:best.a,J:sc.J,notes}}

/* الصف كامل مثل صفحة الجدول: «الخامس الابتدائي»، وصفوف المتوسط والثانوي فوق الثالث تنحسب ابتدائي */
function gFull(g,st){g=String(g||'').trim();if(!g||/الابتدائي|المتوسط|الثانوي/.test(g))return g;st=st||'ابتدائي';const ok=st==='ابتدائي'||['الأول','الثاني','الثالث'].includes(g);return g+' '+SFX[ok?st:'ابتدائي']}
/* ---------- النشر: كل مشترك توصله حصصه من كل الزيارات ---------- */
function payloadFor(e){const out=[];let team=[],lastG='';
  SD.visits.forEach(v=>{const inV=(v.mem||[]).includes(e);v.days.forEach(d=>{if(!d.g)return;const ab=d.absent||[],h=hijri(d.g);const rows=[],acts=[];
      d.rows.slice().sort((x,y)=>PERIODS.indexOf(x.p)-PERIODS.indexOf(y.p)).forEach(r=>{const m=r.m||[];
        if(r.t==='v'&&(m.includes(e)||(m.includes('*')&&inV&&!ab.includes(e))))rows.push([r.p,r.subject||'',gFull(r.grade,v.stage),r.section||'',r.teacher||'',r.nid||'']);
        if(r.t==='a'&&r.p!=='الطابور'&&((m.includes('*')&&inV&&!ab.includes(e))||m.includes(e)))[r.text,r.text2].forEach(t=>{t=String(t||'').trim();if(t&&!acts.includes(t))acts.push(t)})});
      if(rows.length||acts.length){out.push([dayName(d.g),h.d+'/'+h.m+'/'+h.y,v.school||'',rows,STG[v.stage]||'p',acts]);if(d.g>=lastG){lastG=d.g;team=(v.mem||[]).map(nm)}}})});
  return {k:'tq',f:nm(e),r:team.length?team:[nm(e)],d:out}}
async function publish(){const v=CV(),bad=[];if(!v.school)bad.push('الزيارة بدون اسم مدرسة');v.days.forEach(d=>{if(!d.g)bad.push('يوم بدون تاريخ');d.rows.forEach(r=>{if(r.t==='v'&&!(r.m||[]).length)bad.push('حصة '+(r.subject||'')+' '+r.p+' بدون عضو')})});
  if(bad.length&&!await uiConfirm('فيه نواقص:\n• '+[...new Set(bad)].slice(0,8).join('\n• ')+'\n\nتنشر كذا؟'))return;
  const to=[...new Set((v.mem||[]).concat(v.pubMem||[]))].filter(e=>e.indexOf('x:')!==0);v.pubMem=(v.mem||[]).filter(e=>e.indexOf('x:')!==0);v.pubAt=Date.now();v.dirty=0;
  if(!to.length){saveSD(true);return uiAlert('الزيارة انحفظت. ما فيها مشتركين ينرسل لهم.')}
  await publishTo(to)}
/* مفتاح التوصيل المشترك: ينصنع مرة وحدة، ويقرأه المشتركين بس */
let DK=null;async function deliveryKey(){if(DK)return DK;const d=await fs('GET','/cfg/inbox');if(d){DK=b64d(U(d.fields).k);return DK}const k=nacl.randomBytes(32);await fs('PATCH','/cfg/inbox?currentDocument.exists=false',F({k:b64e(k)}));DK=k;return DK}
async function publishTo(to){modal('<h2>نشر الحصص</h2><div id="pubL" class="plist"></div><div class="row mt"><button class="btn" onclick="closeM();VI>=0?vSch():vList()">تم</button></div>');
  const L=$('#pubL'),line=t=>{L.insertAdjacentHTML('beforeend','<div class="prow"><b>'+esc(t)+'</b><span></span></div>');return L.lastChild.querySelector('span')};
  await saveSD(true);
  for(const e of to){const sp=line(nm(e));sp.textContent='لحظة…';
    try{const K=await deliveryKey(),pl=payloadFor(e),n=pl.d.reduce((x,d)=>x+d[3].length,0);
      const nn=nacl.randomBytes(24),c=b64e(cat(nn,nacl.secretbox(enc(JSON.stringify(pl)),nn,K)));
      await fs('PATCH','/inbox/'+encodeURIComponent(e),F({c,ts:Date.now(),n,v:2}));SD.pub[e]=Date.now();sp.textContent='وصلته '+n+' حصة من كل زياراته ✓';sp.className='ok'}
    catch(x){sp.textContent=errTxt(x);sp.className='err'}}
  saveSD(true)}

/* ---------- استيراد زيارات من ملف (يجهّزه Claude في المحادثة) ----------
   الأعضاء في الملف بأسماء الدخول أو الجوال، واللي ما له حساب يدخل باسمه */
function importFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importVisits(JSON.parse(r.result))}catch(e){uiAlert('هذا الملف مو ملف زيارات')}};r.readAsText(f)};i.click()}
function memOf(x){x=String(x||'').trim();if(!x)return null;if(x==='*')return '*';if(x.indexOf('x:')===0)return x;const u=normUser(x.replace(/^user:/,'')),e=emailOf(u);if(ACC.some(a=>a.email===e))return e;const byName=ACC.find(a=>(a.name||'').trim()===x);return byName?byName.email:'x:'+x}
function importVisits(o){if(!o||o.kind!=='tq-visits'||!Array.isArray(o.visits))return uiAlert('هذا الملف مو ملف زيارات');let add=0,upd=0;
  o.visits.forEach(v=>{const nv={id:v.id||rid(),school:v.school||'',stage:v.stage||'ابتدائي',sup:memOf(v.sup)||'',supJoin:v.supJoin!==false,rules:(v.rules||[]).map(r=>({s:r.s,m:memOf(r.m)})),mem:[],dirty:1,
      days:(v.days||[]).map(d=>({id:d.id||rid(),g:d.g,absent:(d.absent||[]).map(memOf).filter(Boolean),rows:(d.rows||[]).map(r=>Object.assign({},r,{id:r.id||rid(),m:(r.m||[]).map(memOf).filter(Boolean)}))}))};
    nv.mem=[...new Set((v.mem||[]).map(memOf).filter(x=>x&&x!=='*').concat(nv.days.flatMap(d=>d.rows.flatMap(r=>r.m.filter(x=>x!=='*')))))];
    const k=SD.visits.findIndex(x=>x.id===nv.id);if(k>=0){nv.pubMem=SD.visits[k].pubMem;nv.pubAt=SD.visits[k].pubAt;SD.visits[k]=nv;upd++}else{SD.visits.push(nv);add++}});
  saveSD(true);vList();uiAlert('انضافت '+add+' زيارة'+(upd?' وتحدّثت '+upd:'')+'. افتح كل زيارة وتأكد منها، ثم «اعتماد ونشر».')}
</script>
