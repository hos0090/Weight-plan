<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title data-keep="title">جدول العمل اليومي</title>
<link data-keep="font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@500;600;700&amp;family=Almarai:wght@400;700;800&amp;family=Noto+Kufi+Arabic:wght@500;600;700&amp;display=swap">
<style data-keep="style">
/* Layout: sticky tool bar on top, one A4 paper sheet per day centred on a calm desk ground, contextual action bar at the bottom while editing */
:root{
  --bg:#ECE6DA; --fg:#1F2622; --panel:#FFFDF8; --line:#D8CBAE; --muted:#6E6656;
  --accent:#123F31; --accent-fg:#F3E6C4; --gold:#B08D57; --danger:#9B2C2C; --chip:#F3ECDC;
  --sans:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif; --display:"Amiri","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --fg:#ECE6D8; --panel:#1C2420; --line:#38443E; --muted:#A79F8E;
  --accent:#C9A86A; --accent-fg:#141A17; --gold:#C9A86A; --danger:#E58A8A; --chip:#25302B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --fg:#ECE6D8; --panel:#1C2420; --line:#38443E; --muted:#A79F8E;
  --accent:#C9A86A; --accent-fg:#141A17; --gold:#C9A86A; --danger:#E58A8A; --chip:#25302B; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);direction:rtl}
#app{padding-inline:16px;padding-block:0 140px}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- tool bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.bmark{width:14px;height:14px;border:1.5px solid var(--gold);transform:rotate(45deg);flex:none;position:relative}
.bmark::after{content:"";position:absolute;inset:3px;background:var(--gold)}
.brand b{display:block;font-weight:700;font-size:15px}
.brand small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.brand small::before{content:"";width:7px;height:7px;border-radius:50%;background:#3E8E6A}
.brand small.dirty::before{background:#C98A2E}
.bar-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn,.bar-btns>button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.btn:hover,.bar-btns>button:hover{border-color:var(--gold)}
.btn[disabled],.bar-btns>button[disabled],.abar button[disabled]{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent)!important;color:var(--accent-fg)!important;border-color:var(--accent)!important}
.warn{border-color:var(--gold)!important;box-shadow:inset 0 -2px 0 var(--gold)}
.danger{color:var(--danger)!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:7px 14px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);box-shadow:inset 0 -2px 0 var(--gold)}

/* ---------- settings panel ---------- */
.panel{max-width:794px;margin:18px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.panel h3{margin:0 0 4px;font-size:15px}
.hint{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.6}
.rrow{display:flex;gap:6px;margin-bottom:6px}
.rrow .rnum{width:22px;flex:none;align-self:center;text-align:center;font-weight:700;color:var(--muted);font-size:12.5px}
.rrow .btn .ic{margin:0}
.panel-in>div:first-child{grid-column:1/-1;max-width:560px}
.rrow .btn{padding:7px 10px}
.rrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 10px}

/* ---------- calendar ---------- */
.cal{max-width:1100px}
.cal-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.cal-head h3{margin:0 0 4px;font-size:16px}
.cal-actions{display:flex;flex-wrap:wrap;gap:6px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.month{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.month h4{margin:0 0 8px;text-align:center;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{min-width:0;overflow:hidden;white-space:nowrap;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cd{min-width:0;overflow:hidden;min-height:44px;border:1px solid transparent;border-radius:6px;background:var(--panel);color:var(--fg);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 1px;gap:1px;line-height:1.2}
.cd:hover{border-color:var(--gold)}
.cd.off{opacity:.45}
.cd.has{background:var(--accent);color:var(--accent-fg)}
.cd.has small{font-size:9px;font-weight:600;opacity:.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cd.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cd.shown{outline:2px solid var(--gold);outline-offset:1px}
.cd.blank{background:transparent;border:0;pointer-events:none}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.range b{font-size:13.5px;margin-left:4px}
.range label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.range select{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;max-width:100%}
.visits{margin-top:18px;display:grid;gap:8px}
.visits h4{margin:0;font-size:14px}
.vg{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.vg b{font-size:13.5px;margin-left:4px}
.vchip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.vchip[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.vbanner{max-width:794px;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.per .mini{display:block;margin:8px auto 0;white-space:nowrap}
.sheet.tight .grid td{padding-top:3px;padding-bottom:3px}
.sheet.tight .nm+.nm{margin-top:3px;padding-top:3px}
.sheet.tight .cap{margin:12px 0 8px}
.sheet.tight .facts{margin-top:6px}.sheet.tight .fact{padding-top:6px;padding-bottom:6px}
.sheet.tight h1.title{font-size:36px}
.sheet.tighter .grid td{font-size:12.5px;line-height:1.3}
.sheet.tighter .nm{font-size:12.5px;line-height:1.3}
.sheet.tighter .asm-l,.sheet.tighter .asm-t{padding-top:7px;padding-bottom:7px}

/* ---------- checks + import ---------- */
.warnbtn{border-color:#C98A2E!important;color:#8A5A12!important}
:root[data-theme="dark"] .warnbtn{color:#E8B860!important}
.issues ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.issues li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:13px}
.issues li span{min-width:0}
.issues small{color:var(--muted)}
.grid tr.haswarn td:not(.per){box-shadow:inset 0 0 0 999px rgba(201,138,46,.10)}
.grid tr.haswarn td:last-child{box-shadow:inset 0 0 0 999px rgba(201,138,46,.10),inset 4px 0 0 #C98A2E}
.imp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.imp{grid-template-columns:1fr}}
.imp img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:8px}
.imp input[type=file]{max-width:100%}
.imp .prog{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.ibanner{max-width:794px;margin:18px auto 0;border:1px solid #C98A2E;border-radius:10px;background:var(--chip);padding:12px 14px;font-size:13px;line-height:1.7}
.ibanner b{display:block;font-size:14px}
.ibanner ul{margin:4px 0 0;padding-inline-start:18px}
.ibanner details{margin-top:6px}
.ibanner img{max-width:100%;border-radius:8px;margin-top:6px}
.vsec{margin-top:16px}
.vsec h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.vsec h4 em{font-style:normal;font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700}
.opt:hover{border-color:var(--gold)}
.opt small{font-weight:600;color:var(--muted)}
.diff{font-size:13px}
.diff .cur{color:var(--danger);font-weight:700}
.diff .img{color:#2F7A55;font-weight:700}
:root[data-theme="dark"] .diff .img{color:#7FD1A8}
.vimg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:720px){.vimg{grid-template-columns:1fr}}
.vimg img{max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--line)}
.vimg select,.vimg input[type=file]{max-width:100%}
.vimg select{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600}
.okline{color:#2F7A55;font-weight:700;font-size:13px}
:root[data-theme="dark"] .okline{color:#7FD1A8}
/* summary sheet */
.sumh{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 8px;font-weight:700;font-size:15px;color:var(--sgr)}
.sumh i{width:6px;height:6px;background:var(--sg);transform:rotate(45deg)}
table.sum td{padding:7px 6px}
table.sum td.l{text-align:right;padding-right:12px}
table.sum tr:nth-child(even) td{background:#F6EEDC}
table.sum b.n{font-size:16px;color:var(--sgr)}
.subj{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px}
.subj span{border:1px solid var(--sgl);border-radius:6px;padding:3px 10px;font-weight:700;font-size:13px;color:var(--ink);background:#FFFDF8}
.subj em{font-style:normal;color:var(--sgd);margin-right:6px}
.sumnote{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
/* teachers directory */
.tdir input[type=search]{width:100%;max-width:360px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.tscroll{overflow-x:auto;margin-top:10px}
.ttab{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.ttab th{text-align:right;font-weight:700;color:var(--muted);font-size:12px;padding:8px;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--panel)}
.ttab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ttab td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ttab tr:hover td{background:var(--chip)}
.qrshow{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:8px}
.qrbox{background:#fff;border-radius:12px;padding:7%;box-sizing:border-box;width:min(560px,100%);aspect-ratio:1/1;box-shadow:0 0 0 1px var(--line)}
.qrbox svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.qrside{flex:1;min-width:200px}
.sendstamp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0 2px;font-size:15px}
.sendstamp .upd{background:#C98A2E;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.sendstamp small{color:var(--muted);font-size:12.5px;font-weight:600}
.qrpdf{position:fixed;left:-3000px;top:0;width:794px;height:1123px;box-sizing:border-box;padding:60px 70px;background:#fff;color:#123F31;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;direction:rtl;display:flex;flex-direction:column;align-items:center;text-align:center}
.qrpdf .qp-top{width:100%;display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#87672F;border-bottom:1.5px solid #B08D57;padding-bottom:10px}
.qrpdf h1{font-family:"Amiri",serif;font-size:38px;margin:26px 0 6px;font-weight:700}
.qrpdf .qp-period{font-size:26px;font-weight:700;color:#1E5A46}
.qrpdf .qp-stamp{margin-top:10px;font-size:15px;color:#555}.qrpdf .qp-stamp b{background:#C98A2E;color:#fff;border-radius:999px;padding:2px 12px}
.qrpdf .qp-days{margin-top:8px;font-size:13.5px;color:#777;max-width:90%}
.qrpdf .qp-code{width:520px;height:520px;margin-top:34px;padding:22px;border:1.5px solid #E3D3AE;border-radius:14px}
.qrpdf .qp-code svg{width:100%;height:100%;display:block;shape-rendering:crispEdges}
.qrpdf .qp-part{margin-top:14px;font-size:22px;font-weight:700}
.qrpdf .qp-how{margin-top:auto;font-size:15px;color:#444;border-top:1px solid #E3D3AE;padding-top:14px;width:100%}
.qrside b{font-size:20px;display:block;margin-bottom:6px}
.bkbar{max-width:794px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px dashed var(--gold);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;background:var(--panel)}
/* day picker strip */
.pick{max-width:1100px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.pk-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pk-wk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pk-wk b{font-size:14.5px;min-width:0}
.pk-nav{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px}
.pk-quick{display:flex;gap:6px;flex-wrap:wrap}
.pk-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pk-day{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 10px;min-height:62px;position:relative}
.pk-day b{font-size:14px}
.pk-day small{font-size:11.5px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-day[aria-pressed="true"]{border-color:var(--accent);background:var(--chip);box-shadow:inset 0 0 0 1px var(--accent)}
.pk-day[aria-pressed="true"]::after{content:"✓";position:absolute;left:9px;top:7px;font-weight:800;color:var(--accent);font-size:14px}
.pk-day.new{border-style:dashed;background:transparent;color:var(--muted)}
.pk-day.new b{color:var(--muted)}
.pk-day.today b::after{content:" · اليوم";color:var(--gold);font-size:11px}
.pk-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;font-weight:600}
.pk-foot .what{min-width:0}
.pk-foot .acts{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,24,21,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.modal>div{background:var(--panel);color:var(--fg);border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto;border:1px solid var(--line)}
.modal h3{margin:0 0 6px;font-size:16px}
.modal ul{padding-inline-start:18px;font-size:13px;line-height:1.8;margin:6px 0 12px}
.modal .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* ---------- site shell ---------- */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;background:var(--panel);border-bottom:1px solid var(--line)}
.site-in{max-width:1320px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;min-height:58px}
.site .brand{padding:8px 0}
.nav{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0}
.nav button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:18px 12px 15px;border-bottom:3px solid transparent;border-radius:0}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}
.nav .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:4px;border-radius:999px;background:#C98A2E;color:#fff;font-size:11px;line-height:18px;text-align:center}
.site-act{display:flex;gap:6px;align-items:center;padding:8px 0}
.site-act button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700}
.shell{max-width:1320px;margin:18px auto 0;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:12px;max-height:calc(100vh - 92px);overflow:auto;padding-bottom:6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.box h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.box h4 small{font-weight:600;color:var(--muted);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side .btn{width:100%;text-align:center}
.side .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.side select{width:100%}
.qk{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.qk button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.side input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:13px;margin-bottom:8px}
.wk{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.wk:first-of-type{border-top:0;margin-top:0;padding-top:0}
.wk summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 2px}
.wk summary::-webkit-details-marker{display:none}
.wk summary::before{content:"◂";font-size:11px;transition:transform .15s}
.wk[open] summary::before{transform:rotate(-90deg)}
.wk summary input{margin:0}
.dr{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer}
.dr:hover{background:var(--chip)}
.dr input{width:17px;height:17px;accent-color:#123F31;flex:none}
.dr span{min-width:0;display:flex;flex-direction:column}
.dr b{font-size:13.5px}
.dr small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr.today b::after{content:" · اليوم";color:var(--gold);font-size:11px}
.exp .what{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 8px}
.exp label.chk{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px;cursor:pointer}
.mainc{min-width:0}
.mainc>.panel{max-width:794px}
.empty-main{max-width:794px;margin:40px auto;text-align:center;color:var(--muted);font-weight:600;border:1.5px dashed var(--line);border-radius:12px;padding:40px 16px}
.page{max-width:1100px;margin:18px auto 0}
.page>.panel{max-width:none}
.asm-tools{display:flex;justify-content:flex-start;margin:-6px 0 10px}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none;overflow:visible}
  .days-list{max-height:46vh;overflow:auto}
  .nav button{padding:10px 9px 9px;font-size:13px;white-space:nowrap}
}
@media (max-width:720px){
  .site-in{gap:0 10px}
  .nav{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
  .nav::-webkit-scrollbar{display:none}
  .site .brand small{display:none}
}
@media print{.site,.side{display:none!important}.shell{display:block;margin:0}}

/* icons + mini calendar */
.ic{width:16px;height:16px;flex:none;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn,.site-act button,.qk button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mc-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.mc-head b{font-size:14px}
.mc-nav{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:32px;height:30px;display:inline-flex;align-items:center;justify-content:center}
.mc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mc .wd{font-size:10px}
.mcd{position:relative;aspect-ratio:1/1;min-width:0;border:1px solid transparent;border-radius:8px;background:var(--bg);color:var(--fg);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.mcd:hover{border-color:var(--gold)}
.mcd.off{opacity:.4}
.mcd.has{background:#DCE9E2;color:#123F31}
:root[data-theme="dark"] .mcd.has{background:#24433A;color:#D9F0E4}
.mcd.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#123F31}
.mcd.sel{background:var(--accent);color:var(--accent-fg)}
.mcd.sel::after{background:var(--accent-fg)}
.mcd.nw{border:2px dashed var(--gold);background:transparent}
.mcd.today{box-shadow:inset 0 0 0 2px var(--gold)}
.mcd.cur{background:var(--gold);color:#fff}
.mcd.blank{visibility:hidden;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-left:4px}
.lg-has{background:#DCE9E2;border:1px solid #9DBAAD}.lg-sel{background:#123F31}.lg-nw{border:1.5px dashed #B08D57}
.newbox{margin-top:10px;border:1px solid var(--gold);border-radius:10px;padding:10px;background:var(--chip);font-size:12.5px;font-weight:600}
.newbox p{margin:0 0 8px;line-height:1.6}
.dt-date{display:flex;flex-direction:column;gap:2px}
.dt-date small{color:var(--muted);font-weight:600;font-size:12px}
.modal .mc{max-width:330px;margin:0 auto}


/* whole-team names, member picker, simpler sidebar */
.allcap{display:block;font-size:10.5px;font-weight:700;color:var(--sgd);margin-bottom:2px}
.allcap+.nm{border-top:0!important;margin-top:0!important;padding-top:0!important}
.allnames{display:flex;flex-wrap:wrap;justify-content:center;gap:0 4px;font-weight:700;font-size:12px;line-height:1.5;color:var(--sgr);max-width:100%}
.allnames span{white-space:nowrap}.allnames i{font-style:normal;color:var(--sg)}
.allnames+.nm{margin-top:4px;padding-top:4px;border-top:1px solid var(--sgl)}
.memedit{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;border:1px dashed var(--sg);background:transparent;border-radius:6px;padding:4px 2px;font:inherit;color:inherit;cursor:pointer}
.memedit:hover{background:var(--sgt)}
.memhint{display:inline-flex;align-items:center;gap:3px;font:700 10.5px var(--sans);color:var(--sgd)}
.memhint .ic{width:11px;height:11px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer}
.mrow:hover{background:var(--chip)}
.mrow input{width:19px;height:19px;accent-color:#123F31;flex:none}
.mrow span{display:flex;flex-direction:column}
.mrow b{font-size:14px}.mrow small{font-size:12px;color:var(--muted)}
.msep{border-top:1px solid var(--line);margin:4px 0}
.side-toggle{display:none}
.box.drafts{border-color:var(--gold);border-style:dashed}
.side-pick{display:grid;gap:12px}
.rng{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.rng summary{cursor:pointer;font-weight:700;color:var(--muted)}
.rng label{display:flex;align-items:center;gap:6px;margin-top:6px;font-weight:600}
.rng select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 6px;font-size:12.5px}
.rng .btn{margin-top:8px}
.side .bkbar{margin:0;font-size:12px;display:grid;gap:8px;padding:10px 12px}
.abar button{display:inline-flex;align-items:center;gap:5px}
@media (max-width:980px){
  .side-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:13px;text-align:right}
  .side-toggle span{display:flex;align-items:center;gap:8px;min-width:0}
  .side-toggle b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-toggle em{font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap}
  .side:not(.open) .side-pick{display:none}
  .side-pick{display:grid;gap:12px}
}
/* ---------- day wrapper ---------- */
.day{margin-top:26px}
.day-tools{max-width:794px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.day-tools>span{font-weight:700;font-size:14px}
.dt-btns{display:flex;flex-wrap:wrap;gap:6px}
.stage{overflow-x:auto;padding-block:4px 14px}
.add-day,.add-period-wrap{display:flex;justify-content:center}
.add-day{margin-top:26px}
.add-day button{border:1.5px dashed var(--gold);background:transparent;color:var(--fg);border-radius:10px;padding:12px 26px;font-weight:700}

/* ---------- the paper sheet (always paper-coloured, like the printed page) ---------- */
.sheet{
  --iv:#FFFDF8; --sg:#B08D57; --sgd:#87672F; --sgl:#E3D3AE; --sgt:#F6EFDE; --sgr:#123F31; --sgr2:#1E5A46; --ink:#1D2420; --mut:#857C6A; --rule:#C9AF80;
  position:relative;width:794px;min-height:1123px;margin:0 auto;background:var(--iv);color:var(--ink);
  box-shadow:0 1px 2px rgba(40,30,10,.10),0 18px 48px rgba(60,45,20,.18);font-family:var(--fb);direction:rtl;flex:none}
.sheet{--fb:var(--sans);--fd:var(--display)}
.sheet.ft-naskh{--fb:"Noto Naskh Arabic","Traditional Arabic",serif;--fd:"Amiri","Noto Naskh Arabic",serif}
.sheet.ft-almarai{--fb:"Almarai",Tahoma,sans-serif;--fd:"Almarai",Tahoma,sans-serif}
.sheet.ft-kufi{--fb:"Noto Kufi Arabic",Tahoma,sans-serif;--fd:"Noto Kufi Arabic",Tahoma,sans-serif}
.sheet.ft-almarai h1.title,.sheet.ft-kufi h1.title{font-size:34px;font-weight:800;line-height:1.5}
.sheet.ft-almarai .school,.sheet.ft-kufi .school{font-size:21px;line-height:1.7}
.pname{white-space:nowrap}
.sheet.ft-kufi .grid td{font-size:11.5px;line-height:1.55;padding-top:5px;padding-bottom:5px}.sheet.ft-kufi .nm{font-size:11.5px}.sheet.ft-kufi .grid th{font-size:11px}.sheet.ft-kufi .pname{font-size:13.5px}.sheet.ft-kufi .asm-l{font-size:12px}
.sheet.ft-almarai .pname{font-size:14.5px}.sheet.ft-kufi .nm+.nm,.sheet.ft-kufi .nm+.nm{margin-top:4px;padding-top:4px}
.sheet.ft-kufi h1.title{font-size:31px}.sheet.ft-kufi .fact b{font-size:17px}
.sheet.ft-naskh .grid td{font-size:14px;line-height:1.35}.sheet.ft-naskh .nm{font-size:14px;line-height:1.35}.sheet.ft-naskh .pname{font-size:17px}
.sheet .gsel,.sheet .mem-add,.sheet .mini,.sheet .newmem input,.sheet .newmem button{font-family:var(--sans)}
.frame{position:absolute;inset:18px;border:1.3px solid var(--sg);pointer-events:none}
.frame::before{content:"";position:absolute;inset:5px;border:.7px solid var(--sgl)}
.c{position:absolute;width:10px;height:10px;background:var(--iv);border:1.3px solid var(--sg);transform:rotate(45deg)}
.c.tl{top:-7px;left:-7px}.c.tr{top:-7px;right:-7px}.c.bl{bottom:-7px;left:-7px}.c.br{bottom:-7px;right:-7px}
.inner{position:relative;min-height:1123px;box-sizing:border-box;padding:44px 48px 38px;display:flex;flex-direction:column}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.top-r{text-align:right}.top-l{text-align:left}
.top .k{font-weight:700;font-size:14.5px;color:var(--sgr)}
.top .s{font-weight:600;font-size:12.5px;color:var(--mut);margin-top:3px}
.emblem{position:relative;width:50px;height:50px}
.emblem i{position:absolute;inset:8px;border:1.4px solid var(--sg)}
.emblem i+i{transform:rotate(45deg)}
.emblem b{position:absolute;inset:20px;background:var(--sg);transform:rotate(45deg)}

h1.title{margin:12px 0 0;text-align:center;font-family:var(--fd);font-weight:700;font-size:40px;line-height:1.35;color:var(--sgr)}
.school{display:flex;justify-content:center;align-items:center;gap:12px;font-family:var(--fd);font-weight:700;font-size:27px;line-height:1.5;color:var(--sgd);margin-top:2px}
.dot{width:6px;height:6px;background:var(--sg);transform:rotate(45deg)}
.orn{display:flex;align-items:center;gap:10px;width:56%;margin:8px auto 0}
.orn span{flex:1;height:1px;background:var(--sg)}
.orn i{width:8px;height:8px;border:1.3px solid var(--sg);transform:rotate(45deg)}

.facts{display:flex;justify-content:center;margin-top:10px;border-top:1px solid var(--sgl);border-bottom:1px solid var(--sgl)}
.fact{padding:9px 30px;text-align:center;border-right:1px solid var(--sgl)}
.fact:first-child{border-right:0}
.fact small{display:block;font-weight:600;font-size:11.5px;color:var(--mut)}
.fact b{display:block;font-weight:700;font-size:19px;color:var(--sgr);font-variant-numeric:tabular-nums}

.cap{display:flex;justify-content:center;align-items:center;gap:12px;margin:18px 0 10px;font-weight:700;font-size:16.5px;color:var(--sgr)}
.cap i{width:6px;height:6px;background:var(--sg);transform:rotate(45deg)}

.asm{display:grid;grid-template-columns:110px 1fr 168px;border:1.3px solid var(--sg);border-radius:8px;overflow:hidden;background:var(--sgt);margin-bottom:12px}
.asm-l{background:var(--sg);color:#FFFDF6;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;padding:11px 8px;text-align:center}
.asm-t{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--sgd);padding:10px}
.asm-m{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--sgl);padding:6px}

.tbl{border:1.4px solid var(--sgr);border-radius:8px;overflow:hidden}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.grid th{background:var(--sgr);color:#EEDCAE;font-weight:700;font-size:12.5px;padding:10px 4px;text-align:center;border-left:1px solid #2C6551}
.grid th:last-child{border-left:0}
.grid td{padding:9px 6px;text-align:center;vertical-align:middle;border-top:2px solid var(--sg);border-left:1px solid var(--sgl);font-weight:700;font-size:13px;line-height:1.5;background:#FFFDF8;overflow-wrap:anywhere}
.grid td:last-child{border-left:0}
.grid tr.pfirst td{border-top:3.2px solid var(--sgr)}
.grid tbody tr:first-child td{border-top:0}
.grid tr td{background:#FFFDF8}
.grid tr.z td{background:#F6EEDC}
.grid td.per{background:var(--sgt);border-left:1.3px solid var(--sg)}
.grid tr.alt td.per{background:#F0E5CB}
.pn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.3px solid var(--sg);color:var(--sgd);font-size:11.5px;font-weight:700;background:#FFFDF8}
.pname{display:block;font-weight:700;font-size:15.5px;color:var(--sgr)}
.pname::after{content:"";display:block;width:22px;height:1.5px;background:var(--sg);margin:6px auto 0}
.nid{font-variant-numeric:tabular-nums;color:#2F3B35;font-size:12.5px!important}
.gwrap{display:inline-flex;align-items:center;gap:5px;flex-wrap:nowrap;justify-content:center;white-space:nowrap}
.gtxt{display:inline-block;white-space:normal;text-align:center;line-height:1.45;padding-inline:4px}
.gsec{color:var(--sgd);font-size:15px}
.sec{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;background:var(--sg);color:#fff;font-size:12px;font-weight:700}
.grid td.act{background:#FAF2E0;color:var(--sgd);font-size:13.5px}
.grid tr.alt td.act{background:#F5EBD3}
.dia{display:inline-block;width:6px;height:6px;background:var(--sg);transform:rotate(45deg);margin-left:9px;vertical-align:middle}
.mutedp{color:#C2B28C;font-weight:600}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;border:1px solid #9DBAAD;background:#EDF4F0;color:var(--sgr);font-weight:700;font-size:11px;line-height:1.65;white-space:nowrap}
.names{display:flex;flex-direction:column;align-items:center}
.nm{display:block;font-weight:700;font-size:13px;line-height:1.55;color:var(--sgr);white-space:nowrap}
.nm+.nm{margin-top:6px;padding-top:6px;border-top:1px solid var(--sgl);min-width:62%}
.nm.all{color:var(--sgd)}
.pill.all{background:var(--sgt);border-color:var(--sgl);color:var(--sgd)}

.dist{margin-top:10px;margin-bottom:10px;text-align:center}
.dist-cap{font-weight:700;font-size:12px;color:var(--mut);margin-bottom:8px}
.dist-row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 18px;padding:9px 0;border-top:1px solid var(--sgl);border-bottom:1px solid var(--sgl)}
.dsep{width:5px;height:5px;background:var(--sg);transform:rotate(45deg)}
.dp{display:inline-flex;align-items:baseline;gap:8px}
.dp b{font-weight:700;font-size:13.5px;color:var(--sgr)}
.dc{font-weight:600;font-size:12px;color:var(--sgd)}
.dp em{font-style:normal;font-weight:700;font-size:11.5px;background:var(--sgr);color:#EEDCAE;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}

.foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--sgl);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-weight:600;font-size:11px;color:var(--mut)}
.foot>span:first-child{text-align:right}.foot>span:last-child{text-align:left}
.dd{display:flex;gap:6px}.dd i{width:5px;height:5px;background:var(--sg);transform:rotate(45deg)}

/* ---------- editing affordances ---------- */
.editing .ed{display:inline-block;min-width:1.6em;border-radius:4px;padding:0 3px;cursor:text;outline:1px dashed transparent;transition:background .15s}
.editing .ed:hover{background:rgba(176,141,87,.14);outline-color:rgba(176,141,87,.5)}
.editing .ed:focus{outline:2px solid var(--sg);background:#fff}
.ed:empty::before{content:attr(data-ph);color:#B9AC8E;font-weight:500}
.editing .grid tr.r{cursor:pointer}
.grid tr.sel td{box-shadow:inset 0 0 0 999px rgba(176,141,87,.16)}
.grid tr.sel td:last-child{box-shadow:inset 0 0 0 999px rgba(176,141,87,.16),inset 3px 0 0 var(--sg)}
.pill .x{border:0;background:transparent;color:inherit;font-size:14px;line-height:1;padding:0 2px;opacity:.7}
.pill .x:hover{opacity:1}
.mem-add,.gsel{border:1px dashed var(--sg);background:#FFFDF8;color:var(--sgd);border-radius:999px;font-size:11.5px;font-weight:700;padding:2px 6px;max-width:100%}
.gsel{border-radius:6px;width:100%}
.editing .gwrap{display:flex;flex-direction:column;gap:3px;white-space:normal}
.mini{display:inline-block;margin:4px 6px 0;border:1px dashed var(--sg);background:#FFFDF8;color:var(--sgd);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;font-family:inherit}
.mini:hover{background:var(--sgt)}
.newmem{display:inline-flex;gap:3px;align-items:center}
.newmem input{width:96px;border:1px solid var(--sg);border-radius:6px;padding:2px 6px;font:700 11.5px var(--sans);background:#fff;color:var(--ink)}
.newmem button{border:1px solid var(--sg);background:var(--sg);color:#fff;border-radius:6px;padding:2px 7px;font:700 11px var(--sans)}
.newmem button+button{background:#FFFDF8;color:var(--sgd)}
.add-period{margin:10px auto 0;display:block;border:1.5px dashed var(--sg);background:transparent;color:var(--sgd);border-radius:8px;padding:7px 18px;font-weight:700;font-size:13px}

/* ---------- contextual action bar ---------- */
.abar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.abar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ab-info{min-width:0}
.ab-info b{display:block;font-size:14px}
.ab-info small{color:var(--muted);font-size:12px}
.ab-grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ab-l{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:2px}
.abar button,.abar select{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.ab-close{margin-inline-start:auto;font-size:16px!important;line-height:1}

.tsug{position:fixed;z-index:70;background:var(--panel);color:var(--fg);border:1px solid var(--gold);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:4px;min-width:240px;max-width:min(360px,calc(100vw - 24px));max-height:300px;overflow:auto;font-family:var(--sans);direction:rtl}
.tsug button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;color:inherit;text-align:right;padding:7px 9px;border-radius:7px;font-size:13px}
.tsug button b{font-weight:700}.tsug button small{color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tsug button.on,.tsug button:hover{background:var(--chip)}
.tsug .tsh{font-size:11px;color:var(--muted);font-weight:700;padding:4px 9px 2px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;z-index:50;background:rgba(18,24,21,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* printing the page from a normal browser gives one A4 page per day */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  #app{padding:0}
  .bar,.panel,.day-tools,.abar,.add-day,.add-period,#toast,.vbanner,.bkbar,.ibanner,.modal{display:none!important}
  .day{margin:0}.stage{padding:0;overflow:visible}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .day:last-of-type .sheet{break-after:auto;page-break-after:auto}
}
/* school list (replaces the calendar in the sidebar) */
.slist input[type=search]{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:6px}
.sg{border-top:1px solid var(--line);padding-top:4px;margin-top:6px}
.sg:first-of-type{border-top:0;margin-top:0}
.sg summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 4px}
.sg summary::-webkit-details-marker{display:none}
.sg summary span::before{content:"◂";display:inline-block;font-size:10px;margin-left:6px;transition:transform .15s}

/* subjects: «رياضيات» = «الرياضيات», «اسلامية» = «الدراسات الإسلامية» … so the same subject is caught however it was typed */
function subjSame(s){let x=normName(s).replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"");

function clsKey(r){if(!r||r.t!=="v")return "";const g=normName(r.grade).replace(/^ال/,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي"),s=normName(r.section).replace(/[أإآ]/g,"ا");return g?g+"|"+s:"";}

    who.forEach(m=>{const key=m+"|"+c;(seen[key]=seen[key]||[]).push({pi,ri,m,cls:(normName(r.grade)+" "+normName(r.section)).trim(),other:(prior[key]||[]).length})})}));

/* one search over the whole day: nobody on two visits in the same period, nobody sees the same subject twice, nobody visits the same teacher twice, and the load stays even */
function solveDay(d,full){

  team.forEach(m=>{cnt[m]=0;subj[m]={};tch[m]={};cls[m]={}});
  sameSchoolDays(d).forEach(x=>x.periods.forEach(p=>p.rows.forEach(r=>{const c=clsKey(r);if(!c)return;const ms=(r.members||[]).filter(isMember);(ms.includes("*")?team:ms).forEach(m=>{if(m in cls)cls[m][c]=(cls[m][c]||0)+1})})));

      case "row-dup":rows.splice(sel.r+1,0,reid(clone(rows[sel.r])));sel.r++;break;
      case "row-del":if(rows.length===1)rows[0]={id:uid(),t:"e"};else{rows.splice(sel.r,1);sel.r=Math.min(sel.r,rows.length-1)}break;
      case "row-split":{const r=rows[sel.r];if(r.text2!==null&&r.text2!==undefined){r.text=[r.text,r.text2].filter(Boolean).join(" · ");r.text2=null}else r.text2="";break}
      case "p-add-v":case "p-add-a":{const n=a==="p-add-v"?newVisit():newAct();if(rows.length===1&&rows[0].t==="e"){rows[0]=n;sel.r=0}else{rows.push(n);sel.r=rows.length-1}break}
      case "p-add-after":ps.splice(sel.p+1,0,newPeriod(sel.p+1));sel={d:sel.d,p:sel.p+1,r:0};break;
      case "p-up":if(sel.p>0){[ps[sel.p-1],ps[sel.p]]=[ps[sel.p],ps[sel.p-1]];sel.p--}break;
      case "p-down":if(sel.p<ps.length-1){[ps[sel.p+1],ps[sel.p]]=[ps[sel.p],ps[sel.p+1]];sel.p++}break;
      case "p-del":ps.splice(sel.p,1);if(!ps.length)ps.push(newPeriod(0));sel=null;break;
    }
  });
  if(a==="p-del")toast("حُذفت الحصة · تقدر تتراجع");
  if(a==="row-del")toast("حُذف الصف · تقدر تتراجع");
}

/* ---------- save into the page itself ---------- */
function buildDocument(){
  const s=clone(state);delete s.updatedAt;s.savedAt=Date.now();
  {/* keep the last 8 saved versions so any mistake can be undone later, from any device */
   const prev=embedded&&embedded.days?{at:embedded.savedAt||0,roster:embedded.roster||[],days:embedded.days}:null;
   const vs=(embedded&&embedded.versions)||[];const changed=prev&&(JSON.stringify(prev.days)!==JSON.stringify(s.days)||JSON.stringify(prev.roster)!==JSON.stringify(s.roster));
   /* autosave publishes often: keep one restore point per half hour of work */
   const spaced=!vs.length||!prev||(prev.at||0)-(vs[0].at||0)>30*60e3;
   s.versions=(changed&&spaced?[prev].concat(vs):vs).slice(0,12)}
  const json=JSON.stringify(s).replace(/</g,"\\u003c");
  const parts=$$("[data-keep]").map(el=>{
    const k=el.dataset.keep;
    if(k==="state")return '<script type="application/json" id="state" data-keep="state">'+json+"<\/script>";
    if(k==="app")return '<div id="app" data-keep="app"></div>';
    return el.outerHTML;
  });
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+"</style></head><body>"+parts.join("\n")+"</body></html>";
}

function backupBar(){
  if(!state.days.length)return "";
  let last=0,snooze=0;try{last=+localStorage.getItem(KEY+":bk")||0;snooze=+localStorage.getItem(KEY+":bksnooze")||0}catch(e){}
  const now=Date.now(),W=7*864e5;
  if(now-last<W||now<snooze)return "";
  const days=last?Math.floor((now-last)/864e5):null;
  return `<div class="bkbar" role="status"><span>${days===null?"ما نزّلت نسخة احتياطية للحين.":`آخر نسخة احتياطية قبل ${days} ${days<=10?"أيام":"يوماً"}.`}</span>

}

/* file name carries the period: "جدول العمل اليومي - ابتدائية صقر الجزيرة - 2-5-1448هـ.pdf"
   or "جدول العمل اليومي - 3 مدارس - من 30-4 إلى 3-5-1448هـ.pdf" */
function exportName(vd,schools){
  const hs=vd.map(d=>parseH(d.date)).filter(Boolean).sort((a,b)=>hKey(a)-hKey(b));
  let period="";
  if(hs.length){const a=hs[0],b=hs[hs.length-1];
    if(hKey(a)===hKey(b))period=`${a.d}-${a.m}-${a.y}هـ`;
    else if(a.y===b.y)period=`من ${a.d}-${a.m} إلى ${b.d}-${b.m}-${b.y}هـ`;
    else period=`من ${a.d}-${a.m}-${a.y} إلى ${b.d}-${b.m}-${b.y}هـ`;
  }else period=vd.map(d=>d.dayName).filter(Boolean).join(" و");
  const sc=schools.length===1?schools[0]:schools.length===2?"مدرستين":schools.length>2?`${schools.length} مدارس`:"";
  const head=showSum?"ملخص وجدول العمل اليومي":"جدول العمل اليومي";
  return [head,sc,period].filter(Boolean).join(" - ").replace(/[\\/:*?"<>|]+/g,"-")+".pdf";
}
