<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0c13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>سهرة · يد التحكم</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#0a0c13;--card:#151a28;--card2:#1d2336;--line:#2a3147;--gold:#e0b862;--gold2:#f6dea4;--txt:#f1f2f7;--mut:#8d94aa;--ok:#3ddc97;--bad:#ff5d73;--c:#e0b862}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:T,system-ui,sans-serif;background:radial-gradient(circle at 80% -10%,#2a1d48,var(--bg) 60%) fixed;color:var(--txt);user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #ffffff10}
header .av{width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px}
header .nm{font-weight:800;font-size:17px}
header .sc{margin-right:auto;font-family:R;font-weight:700;color:var(--gold2);font-size:20px}
header .x{background:#ffffff10;border:0;color:var(--mut);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px}
header .x.arm{background:var(--bad);color:#fff}
#net{width:9px;height:9px;border-radius:50%;background:var(--ok)}
#net.off{background:var(--bad)}
main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;overflow:auto}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
h2{font-family:R;font-weight:600;font-size:24px;line-height:1.4}
.sub{color:var(--mut);font-size:16px;line-height:1.5}
.big{font-size:72px;line-height:1.1}
.btn{border:0;font:inherit;font-weight:800;font-size:19px;color:var(--txt);background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;width:100%;transition:transform .08s,background .15s;display:flex;align-items:center;gap:12px;text-align:right}
.btn:active{transform:scale(.96);background:var(--card2)}
.btn.gold{background:var(--gold);color:#201604;border-color:var(--gold);justify-content:center}
.btn b{width:36px;height:36px;flex:none;border-radius:10px;background:#ffffff12;display:grid;place-items:center;color:var(--gold2);font-family:R}
.btn .e{font-size:30px}
.btn[disabled]{opacity:.4}
.btn.sel{border-color:var(--gold);background:#e0b86222}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);outline:none;text-align:center}
input:focus{border-color:var(--gold)}
input,textarea{-webkit-user-select:text;user-select:text;touch-action:auto}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.avs button{font-size:28px;background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px 0}
.avs button.sel{border-color:var(--gold);background:#e0b86222}
.label{font-size:15px;color:var(--mut);align-self:flex-start}
.lvls{display:flex;gap:6px;width:100%}
.lvls button{flex:1;font:inherit;font-size:15px;padding:10px 0;border-radius:12px;border:0;background:var(--card);color:var(--txt)}
.lvls button.on{background:var(--gold);color:#201604;font-weight:800}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.games button{font:inherit;background:var(--card);border:2px solid var(--line);color:var(--txt);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.games button:active{transform:scale(.96)}
.games .i{font-size:32px}.games .t{font-weight:800;font-size:15px}
.games .m{font-size:12px;color:var(--mut)}
.games button.lock{opacity:.4}
.buzz{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:0;font:inherit;font-family:R;font-weight:700;font-size:34px;color:#fff;background:radial-gradient(circle at 40% 30%,#ff7a7a,#c21a30);box-shadow:0 12px 0 #6e0c19,0 24px 50px #0009;transition:transform .05s,box-shadow .05s}
.buzz:active,.buzz.hit{transform:translateY(10px);box-shadow:0 2px 0 #6e0c19,0 10px 20px #0009}
.buzz.green{background:radial-gradient(circle at 40% 30%,#6effb5,#12985a);box-shadow:0 12px 0 #0a5a35,0 24px 50px #0009}
.q{font-size:18px;font-weight:700;line-height:1.5;text-align:center}
.qe{font-size:44px;text-align:center}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.c2{display:grid;grid-template-columns:1fr 1fr}
.opts.c2 .btn{flex-direction:column;justify-content:center;text-align:center;min-height:120px}
.btn.wa{background:linear-gradient(160deg,#2f4fa0,#1a2c5c);border:0;min-height:110px;justify-content:center;text-align:center;font-size:21px}
.btn.wb{background:linear-gradient(160deg,#a02f62,#5c1a37);border:0;min-height:110px;justify-content:center;text-align:center;font-size:21px}
.board{display:grid;gap:6px}
.board .h{font-size:12px;font-weight:800;text-align:center;color:var(--mut);padding:4px 0}
.board button{font:inherit;font-family:R;font-weight:700;font-size:18px;padding:14px 0;border-radius:12px;border:2px solid #2d4f80;background:linear-gradient(160deg,#22406a,#152742);color:var(--gold2)}
.board button:disabled{background:#ffffff06;border-color:transparent;color:#ffffff25}
.board button.sel{border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
.dbl{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#ff8a3d22,#ff3d6e22);border:2px solid #ff6d4d;border-radius:14px;padding:12px 14px;font-weight:800}
.dbl.on{background:linear-gradient(90deg,#ff8a3d,#ff3d6e)}
.sw{width:50px;height:28px;border-radius:20px;background:#ffffff30;position:relative}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.dbl.on .sw::after{right:25px}
.ggrid{display:grid;gap:5px;width:100%;aspect-ratio:1}
.ggrid button{border:0;border-radius:8px;background:var(--card2)}
.ggrid button:active{background:var(--gold)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;aspect-ratio:1}
.pads button{border:0;border-radius:22px;opacity:.85}
.pads button:active,.pads button.hit{opacity:1;transform:scale(.95);filter:brightness(1.3)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.keys button{font:inherit;font-family:R;font-size:24px;padding:12px 0;border-radius:14px;border:0;background:var(--card);color:var(--txt)}
.keys button:active{background:var(--card2)}
.num{font-family:R;font-weight:700;font-size:44px;color:var(--gold2);min-height:58px}
canvas#pad{width:100%;aspect-ratio:1.6;background:#fff;border-radius:16px;touch-action:none;display:block}
.colors{display:flex;gap:8px;justify-content:center}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.colors button.sel{border-color:#fff;transform:scale(1.15)}
.word{background:var(--gold);color:#201604;font-weight:800;font-size:22px;border-radius:14px;padding:10px;text-align:center}
.res{font-size:26px;font-weight:800}
.res.good{color:var(--ok)}.res.bad{color:var(--bad)}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.fade{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.tapc{font-family:R;font-size:60px;font-weight:700;color:var(--gold2)}
</style>
</head>
<body>
<header id="hd" style="display:none"><span class="av" id="hav"></span><span class="nm" id="hnm"></span><span class="sc" id="hsc"></span><button class="x" id="hx" style="display:none">إنهاء</button><span id="net" class="off"></span></header>
<main id="m"></main>
<script src="far.js"></script>
<script src="farsock.js"></script>
<script src="phone.js"></script>
</body>
</html>
