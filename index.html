<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1411"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="خطتي للوزن"><style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>خطتي للوزن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky day header, scrollable content, fixed bottom tab bar. Deliberately single dark theme: deep emerald night + champagne gold. */
:root{
  color-scheme:dark;
  --bg:#0b1411; --bg2:#0f1b17; --surface:#14231d; --surface2:#1a2d26; --surface3:#21382f;
  --line:rgba(214,182,120,.16); --line2:rgba(238,242,238,.08);
  --fg:#eef2ec; --mut:#9db0a6; --mut2:#6f857a;
  --gold:#d8b878; --gold2:#f1dfb2; --goldink:#2a2112;
  --ok:#6fd19c; --warn:#e8b25c; --bad:#ec8a7d;
  --c0:#e8a65e; --c1:#b8a2e6; --c2:#6fd19c; --c3:#7db8ea; --c4:#ec8fa6; --cd:#7fc9d6;
  --f-display:"El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r2:12px;
  --glowA:#173127; --glowB:#1b2a1a; --heroA:#1d3a2f; --heroB:#132820; --heroC:#10201a;
  --chip:rgba(255,255,255,.05); --tabbg:rgba(11,20,17,.88); --badtext:#e9c3bc; --cdtext:#cdeef4; --ringA:#f1dfb2; --ringB:#c79a4e; --track:rgba(255,255,255,.08);
}
html[data-skin="beige"]{
  color-scheme:light;
  --bg:#f4eee2; --bg2:#fbf8f1; --surface:#fffdf8; --surface2:#f3ecdf; --surface3:#e4d8c1;
  --line:rgba(146,108,44,.26); --line2:rgba(44,52,40,.10);
  --fg:#1e2a23; --mut:#5d695f; --mut2:#8b938a;
  --gold:#9b6f24; --gold2:#71501a; --goldink:#fffaf0;
  --ok:#22845a; --warn:#b0711a; --bad:#bf4337;
  --c0:#b4631b; --c1:#6a52a8; --c2:#1f8752; --c3:#2c6ca6; --c4:#b03f5e; --cd:#1f7b8b;
  --glowA:#eadcbf; --glowB:#efe5d0; --heroA:#fffaf0; --heroB:#f7efdf; --heroC:#efe3cc;
  --chip:rgba(40,50,40,.05); --tabbg:rgba(251,248,241,.92); --badtext:#9a3a30; --cdtext:#155f6b; --ringA:#c9973f; --ringB:#875a14; --track:rgba(40,50,40,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 100% 0%,var(--glowA) 0%,transparent 60%),radial-gradient(90% 50% at 0% 10%,var(--glowB) 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
input{font:inherit;color:var(--fg)}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.3px}
.muted{color:var(--mut)}
/* ---------- top ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:14px 16px 12px;background:linear-gradient(var(--bg) 70%,transparent);}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:15px;color:var(--gold2);display:flex;align-items:center;gap:8px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.sync{font-size:11px;color:var(--mut2)}
/* ---------- hero ---------- */
.hero{margin-top:6px;border-radius:24px;padding:20px;background:linear-gradient(145deg,var(--heroA) 0%,var(--heroB) 55%,var(--heroC) 100%);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:1px solid rgba(216,184,120,.18)}
.hero::before{content:"";position:absolute;inset:auto -10px -90px auto;width:260px;height:260px;border-radius:50%;border:1px solid rgba(216,184,120,.09)}
.herogrid{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero h1{font-size:28px;line-height:1.25}
.hero .sub{font-size:13px;color:var(--mut);margin-top:4px}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--gold2)}
.ring small{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.nextup{position:relative;z-index:1;margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(216,184,120,.12);border:1px solid var(--line)}
.nextup .lbl{font-size:11px;font-weight:700;color:var(--goldink);background:var(--gold);border-radius:6px;padding:1px 7px;flex:none}
.nextup b{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextup .when{flex:none;font-size:12px;color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.chip{font-size:12px;padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line2);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.chip b{color:var(--gold2);font-weight:600}
/* day nav */
.daynav{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.daynav button.arrow{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;color:var(--gold2)}
.daystrip{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.daystrip::-webkit-scrollbar{display:none}
.dpill{flex:none;width:46px;padding:6px 0 7px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);text-align:center}
.dpill span{display:block;font-size:10px;color:var(--mut)}
.dpill b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2}
.dpill.on{background:var(--gold);border-color:var(--gold)}.dpill.on span,.dpill.on b{color:var(--goldink)}
.dpill.today:not(.on){border-color:var(--gold)}
.dpill .dot{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:transparent}
.dpill .dot.full{background:var(--ok)}.dpill .dot.part{background:var(--warn)}
/* water */
.water{margin-top:14px;border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1px solid var(--line2)}
.whead{display:flex;justify-content:space-between;align-items:baseline}
.whead h3{font-size:16px}
.cups{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:10px}
.cup{height:34px;border-radius:7px 7px 10px 10px;border:1px solid rgba(127,201,214,.35);background:rgba(127,201,214,.05);position:relative;overflow:hidden}
.cup.on{background:linear-gradient(180deg,rgba(127,201,214,.55),rgba(80,160,190,.9));border-color:rgba(127,201,214,.9)}
.wbtns{display:flex;gap:8px;margin-top:10px}
.wbtns button{flex:1;padding:8px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);font-size:13px}
.wbtns button.prim{background:rgba(127,201,214,.14);border-color:rgba(127,201,214,.4);color:var(--cdtext);font-weight:600}
/* timeline */
.sec{margin-top:22px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:20px}
.tl{margin-top:10px;position:relative}
.tl::before{content:"";position:absolute;top:8px;bottom:8px;right:29px;width:1px;background:linear-gradient(var(--line),var(--line2))}
.it{display:flex;gap:12px;align-items:stretch;margin-bottom:10px;position:relative}
.tm{flex:none;width:58px;text-align:center;padding-top:12px}
.tm b{display:block;font-size:13px;font-weight:600;direction:ltr}
.tm .nd{display:block;width:11px;height:11px;margin:6px auto 0;border-radius:50%;border:2px solid var(--mut2);background:var(--bg);position:relative;z-index:1}
.it.done .tm .nd{background:var(--ok);border-color:var(--ok)}
.it.now .tm .nd{border-color:var(--gold);box-shadow:0 0 0 4px rgba(216,184,120,.18)}
.card{flex:1;min-width:0;border-radius:var(--r);background:var(--surface);border:1px solid var(--line2);overflow:hidden}
.it.now .card{border-color:rgba(216,184,120,.55);box-shadow:0 8px 30px -12px rgba(216,184,120,.35)}
.it.done .card{opacity:.62}
.cmain{display:flex;gap:10px;padding:12px 12px 12px 14px;align-items:flex-start}
.cbody{flex:1;min-width:0;text-align:right}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;margin-bottom:5px}
.ctitle{font-family:var(--f-display);font-size:17px;line-height:1.35;font-weight:600}
.cqty{font-size:13px;color:var(--mut);margin-top:2px}
.nowtag{font-size:10px;font-weight:700;color:var(--goldink);background:var(--gold);border-radius:6px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut2);display:grid;place-items:center;margin-top:2px;transition:.15s}
.check{color:var(--bg)}.check svg{opacity:0}
.it.done .check{background:var(--ok);border-color:var(--ok)}.it.done .check svg{opacity:1}
.cact{display:flex;border-top:1px solid var(--line2)}
.cact button{flex:1;padding:9px 6px;font-size:12.5px;color:var(--gold2);display:flex;justify-content:center;align-items:center;gap:6px}
.cact button+button{border-right:1px solid var(--line2)}
.energy{display:inline-block;font-size:12px;font-weight:600;color:var(--gold2);background:rgba(216,184,120,.14);border-radius:8px;padding:2px 8px;margin-top:5px}
.swapped{font-size:11px;color:var(--warn);margin-top:3px}
.t-meal0 .ctag{background:rgba(232,166,94,.14);color:var(--c0)}
.t-meal1 .ctag{background:rgba(184,162,230,.14);color:var(--c1)}
.t-meal2 .ctag{background:rgba(111,209,156,.14);color:var(--c2)}
.t-meal3 .ctag{background:rgba(125,184,234,.14);color:var(--c3)}
.t-meal4 .ctag{background:rgba(236,143,166,.14);color:var(--c4)}
.t-drink .ctag{background:rgba(127,201,214,.12);color:var(--cd)}
.t-walk .ctag{background:rgba(216,184,120,.14);color:var(--gold)}
.t-pill .ctag{background:rgba(236,143,166,.14);color:var(--c4)}.t-pill .ctitle{font-size:15px}
.t-sleep .ctag{background:var(--chip);color:var(--mut)}
.t-drink .ctitle,.t-sleep .ctitle{font-size:15px}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--tabbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mut)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab.on{color:var(--gold)}
/* generic */
.panel{border-radius:var(--r);background:var(--surface);border:1px solid var(--line2);padding:16px;margin-top:12px}
.panel h3{font-size:17px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.row:last-child{border-bottom:0}
.row span:last-child{color:var(--gold2);font-weight:600;text-align:left}
.list{list-style:none;margin:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--gold);color:var(--goldink);font-weight:700;font-size:14px}
.btn.ghost{background:var(--surface2);color:var(--gold2);border:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.seg button{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line2);font-size:13px;color:var(--mut)}
.seg button.on{background:var(--gold);color:var(--goldink);border-color:var(--gold);font-weight:700}
/* week */
.wday{margin-top:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line2);overflow:hidden}
.wdh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.wdh b{font-family:var(--f-display);font-size:22px;color:var(--gold2);line-height:1}
.wdh .nm{font-weight:600}.wdh .dt{font-size:12px;color:var(--mut)}
.wdh .go{margin-inline-start:auto;font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.wm{display:flex;gap:10px;padding:9px 14px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.wm:last-child{border-bottom:0}
.wm i{flex:none;width:6px;border-radius:3px}
.wm .wt{flex:1;min-width:0}.wm .wt b{font-weight:600}.wm .wt div{font-size:12px;color:var(--mut)}
/* recipes grid */
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:0 12px}
.search input{flex:1;background:none;border:0;padding:12px 0;outline:none}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rtile{text-align:right;border-radius:16px;background:var(--surface);border:1px solid var(--line2);padding:13px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.rtile .ctag{align-self:flex-start;margin:0}
.rtile b{font-family:var(--f-display);font-size:15.5px;line-height:1.35;font-weight:600}
.rtile span{font-size:11.5px;color:var(--mut);margin-top:auto}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,8,6,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .in{max-width:560px;width:100%;margin:0 auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;display:flex;flex-direction:column;min-height:0;max-height:100%}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface3);margin:10px auto 0;flex:none}
.shead{padding:12px 18px 12px;display:flex;align-items:flex-start;gap:12px;flex:none;border-bottom:1px solid var(--line2)}
.shead h2{font-size:22px;line-height:1.3}
.shead .x{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--mut)}
.sbody{overflow-y:auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.plate{border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,rgba(216,184,120,.16),rgba(216,184,120,.06));border:1px solid var(--line);font-size:14px;color:var(--gold2)}
.plate b{display:block;font-size:11px;color:var(--gold);font-weight:600;margin-bottom:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.h4{font-family:var(--f-display);font-size:16px;color:var(--gold2);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.h4 small{font-family:var(--f-body);font-size:11px;color:var(--mut)}
.ing li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.ing li .bx{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mut2)}
.ing li .nm{flex:1;min-width:0}
.ing li .am{color:var(--gold2);font-weight:600;font-size:13px;text-align:left;max-width:48%}
.ing li.on .bx{background:var(--ok);border-color:var(--ok)}.ing li.on .nm{text-decoration:line-through;color:var(--mut)}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14.5px}
.steps li .sn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);color:var(--gold2);font-weight:700;font-size:13px}
.steps li.on .sn{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.steps li.on p{color:var(--mut)}
.steps p{margin:3px 0 0}
.tip{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border-right:3px solid var(--gold);font-size:13.5px;color:var(--mut)}
.nosugar{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ok);background:rgba(111,209,156,.12);border-radius:999px;padding:3px 10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);margin-bottom:8px}
.opt.cur{border-color:var(--gold)}
.opt .ot{flex:1;min-width:0}.opt .ot b{font-family:var(--f-display);font-weight:600;font-size:15.5px}.opt .ot div{font-size:12.5px;color:var(--mut)}
.opt .pk{flex:none;font-size:12px;color:var(--gold);font-weight:600}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:rgba(216,184,120,.16);color:var(--gold)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{border-radius:16px;background:var(--surface);border:1px solid var(--line2);padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gold2);line-height:1.2}
.stat span{font-size:11.5px;color:var(--mut)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.wform{display:flex;gap:8px;margin-top:10px}
.wform input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;font-size:16px}
.wlog .row span:first-child{color:var(--mut)}
.del{color:var(--mut2);font-size:12px;margin-inline-start:10px}
/* plan page */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;color:var(--gold);font-weight:600;font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl td.g{color:var(--ok);font-weight:600}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}
.rules li{padding:6px 0;font-size:13.5px;display:flex;gap:8px}
.rules li::before{flex:none;font-weight:800}
.rules li.y::before{content:"✓";color:var(--ok)}.rules li.n::before{content:"✕";color:var(--bad)}
.rules li.n{color:var(--badtext)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
.shop li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer;font-size:14px}
.shop li .bx{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mut2)}
.shop li.on .bx{background:var(--ok);border-color:var(--ok)}.shop li.on .nm{text-decoration:line-through;color:var(--mut)}
.shop li .ct{margin-inline-start:auto;font-size:11.5px;color:var(--mut)}

/* ===== v8 refinement: calmer palette, one numeral face, line icons, motion ===== */
:root{
  --bg:#0a100e; --bg2:#0e1613; --surface:#111b17; --surface2:#16231e; --surface3:#1d2d27;
  --line:rgba(214,182,120,.14); --line2:rgba(238,242,238,.065);
  --fg:#edf0ea; --mut:#93a39a; --mut2:#64766c;
  --gold:#d4b37a; --gold2:#ecdcb4;
  --c0:#d6ae7c; --c1:#b2a8cf; --c2:#93c3a6; --c3:#93b4cf; --c4:#cf9fab; --cd:#8fc0c9;
  --glowA:#13241d; --glowB:#141f17; --heroA:#172b23; --heroB:#111f1a; --heroC:#0e1a16;
  --f-num:"IBM Plex Sans Arabic",system-ui,sans-serif; --ease:cubic-bezier(.2,.8,.2,1);
}
html[data-skin="beige"]{
  --bg:#f3eee4; --bg2:#faf7f0; --surface:#fffdf9; --surface2:#f4eee3; --surface3:#e6dccb;
  --line:rgba(146,108,44,.2); --line2:rgba(44,52,40,.08);
  --fg:#1f2721; --mut:#626c64; --mut2:#949b92;
  --gold:#94692a; --gold2:#6d4e1c;
  --c0:#a8672a; --c1:#6c5b9c; --c2:#2f7d55; --c3:#3a6a96; --c4:#a2495f; --cd:#2a7380;
  --heroA:#fffcf5; --heroB:#f8f1e4; --heroC:#f1e7d4;
}
body{font-size:15px;letter-spacing:0}

.num,.ring b,.stat b,.tm b,.qlog b,.dpill b,.clock,.wdh b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* hero */
.hero.h2{padding:22px 20px 18px;border-radius:28px;box-shadow:0 24px 60px -30px rgba(0,0,0,.55)}

.hnb b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hnb span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hncheck{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--gold2);transition:transform .15s var(--ease),background .2s}
.hncheck:active{transform:scale(.9)}.hncheck.hit{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .45s var(--ease)}

/* quick log */
.qlog{gap:8px;margin-top:16px}

/* notice */
.notice{margin-top:14px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}

/* water */
.water{padding:16px 16px 14px;border-radius:20px}

.cups{gap:6px;margin-top:12px}

@keyframes fillup{from{transform:translateY(100%)}to{transform:none}}
.warnt{color:var(--warn)}

/* timeline */
.sec{margin-top:26px}.sec h2{font-size:21px}
.tl::before{right:29px;background:linear-gradient(var(--line),transparent)}
.it{margin-bottom:12px}
.card{border-radius:20px;transition:border-color .2s,box-shadow .2s}
.cmain{gap:12px;padding:14px 14px 14px 14px;align-items:flex-start}
.cic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--mut)}
.cic .ic{width:19px;height:19px}
.t-meal0 .cic{color:var(--c0)}.t-meal1 .cic,.t-meal3 .cic{color:var(--c2)}.t-meal2 .cic{color:var(--c0)}.t-meal4 .cic{color:var(--c3)}
.t-drink .cic{color:var(--cd)}.t-pill .cic{color:var(--c4)}.t-walk .cic,.t-weigh .cic{color:var(--gold)}.t-sleep .cic{color:var(--c1)}
.ctag,.t-meal0 .ctag,.t-meal1 .ctag,.t-meal2 .ctag,.t-meal3 .ctag,.t-meal4 .ctag,.t-drink .ctag,.t-walk .ctag,.t-pill .ctag,.t-sleep .ctag{background:none;color:var(--mut);padding:0;margin-bottom:2px;font-size:11.5px;font-weight:500}
.ctitle{font-size:16.5px}

.check svg{stroke-dasharray:24;stroke-dashoffset:24;opacity:1;transition:stroke-dashoffset .35s var(--ease) .05s}
.it.done .check svg,.it.justdone .check svg{stroke-dashoffset:0}
.it.justdone .check{background:var(--ok);border-color:var(--ok);animation:pop .45s var(--ease)}
.it.justdone .card{animation:settle .55s var(--ease) forwards}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes settle{0%{opacity:1}100%{opacity:.55}}
.it.done .card{opacity:.55}
.cact button{color:var(--gold2);font-weight:500}.cact button .ic{width:16px;height:16px;color:var(--gold)}
.energy{display:inline-flex;align-items:center;gap:6px;background:rgba(212,179,122,.1)}.energy .ic{width:14px;height:14px;color:var(--gold)}
.donebar{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:12px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);font-size:13.5px;color:var(--mut)}
.donebar b{color:var(--fg)}.dbi{width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}.dbi .ic{width:14px;height:14px;stroke-width:2.4}
.dbm{margin-inline-start:auto;color:var(--gold);font-weight:600}
/* panels & misc */
.panel,.stat,.wday,.rtile,.opt{border-radius:20px}
.stat b{font-weight:600}
.dpill{border-radius:15px}
.tab{transition:color .2s}

/* entrance */
.enter>*{animation:rise .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet .in{border-radius:28px 28px 0 0}
@media (prefers-reduced-motion:reduce){.enter>*,.cup.fill::after,.it.justdone .check,.it.justdone .card{animation:none!important}}

/* ===== v11: Najdi night — indigo dusk, saffron, palm; Reem Kufi display; the day dial ===== */
:root{
  --bg:#0d1322; --bg2:#121a2c; --surface:#151e33; --surface2:#1b2640; --surface3:#24304d;
  --line:rgba(224,181,102,.16); --line2:rgba(237,230,214,.07);

  --glowA:#18233f; --glowB:#141c30; --heroA:#18223a; --heroB:#121a2d; --heroC:#0f1626;

  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);const t=iso(today());const wk=new Date(today());wk.setDate(wk.getDate()-7);
  const last=ws.length?ws[ws.length-1]:null;const prev=ws.filter(w=>w.d<=iso(wk)).pop()||ws[0];const lost=last&&prev?+(prev.kg-last.kg).toFixed(1):null;

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));URL.revokeObjectURL(img.src);};img.onerror=rej;img.src=URL.createObjectURL(file);});}

const hm2min=v=>{if(!v)return null;const [h,m]=v.split(':').map(Number);return h*60+m;};
const min2t=m=>{m=Math.round(m);let h=Math.floor(m/60)%24,mm=m%60;const h12=((h+11)%12)+1;return h12+':'+pad(mm);};

const BASE={wake:390,m0:420,v1:480,m1:600,w2:630,sc:720,m2:810,v2:960,m3:960,eve:1080,m4:1170,walk:1200,night:1320,sleep:1380};
const DEFSTART='08:00';

const dayStartMin=()=>hm2min(cfg().dayStart||DEFSTART);
function wakeFor(d){const sl=S.sleep[iso(d)];const w=sl&&sl.wake?hm2min(sl.wake):null;return (w!==null&&w>=240&&w<900)?w:dayStartMin();}
function planTimes(W0){
  const T={},drop={};const sh=Math.min(Math.max(W0,240),480)-390;
  for(const k in BASE)T[k]=BASE[k]+sh;
  if(W0>480){const B=W0+30;T.wake=W0;T.m0=B;T.v1=B+60;T.w2=B+150;
    T.m2=Math.max(T.m2,Math.min(990,B+240));
    T.m1=B+165;if(T.m1>T.m2-90)drop.m1=1;
    T.sc=T.m2-75;if(T.sc<B+90)T.sc=T.m2+60;
    T.m3=T.m2+150;if(T.m3>T.m4-90)drop.m3=1;
    T.v2=T.m2+150;if(T.v2>1080||T.v2<=T.sc+120)drop.v2=1;
    T.eve=Math.max(T.m4-90,T.m2+120);if(T.v1>1020)drop.v1=1;}
  return {T,drop};}
const MJDAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function sleepStepsStats(){
  const t=today();let sh=[],stp=[];for(let i=0;i<7;i++){const x=new Date(t);x.setDate(t.getDate()-i);const h=sleepHours(x);if(h!==null)sh.push(h);const s=S.steps[iso(x)];if(s)stp.push(s);}
  const avg=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;const ah=avg(sh),as=avg(stp);
  let bars='';for(let i=6;i>=0;i--){const x=new Date(t);x.setDate(t.getDate()-i);const s=S.steps[iso(x)]||0,g=stepGoal(x);bars+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:70px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.min(100,s/g*100)}%;min-height:2px;border-radius:4px 4px 2px 2px;background:${s>=g?'var(--ok)':'var(--gold)'}"></div></div><span style="font-size:10px;color:var(--mut)">${WD[x.getDay()].replace('ال','').slice(0,3)}</span></div>`;}
  return `<div class="panel"><h3>النوم والخطوات (آخر 7 أيام)</h3><div class="stats" style="margin-top:6px"><div class="stat"><b class="num">${ah===null?'—':ah.toFixed(1)}</b><span>ساعات النوم</span></div><div class="stat"><b class="num">${as===null?'—':Math.round(as).toLocaleString('en')}</b><span>متوسط الخطوات</span></div><div class="stat"><b class="num">${stepGoal(t).toLocaleString('en')}</b><span>هدفك اليومي</span></div></div><div style="display:flex;gap:6px;margin-top:12px">${bars}</div></div>`;
}

async function seedHealth(){try{if(!fam||(S.cfg&&S.cfg.seed1)||!crypto.subtle)return;const raw=Uint8Array.from(atob(SEED1),c=>c.charCodeAt(0));
  const kb=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('labs-seed:'+fam));const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));const o=JSON.parse(new TextDecoder().decode(pt));
  S.labs=S.labs||{};for(const k in o.labs)if(S.labs[k]===undefined)S.labs[k]=o.labs[k];
  for(const w of o.w)if(!S.weights.some(x=>x.d===w.d))S.weights.push(w);
  cfg().seed1='1';save();render();}catch(e){}}

function dialSVG(d,its,isT,nowM,pct,doneN,total){

  const C=150,R=118,ang=m=>Math.max(0,Math.min(1,(m-A0)/span))*330-165;          // 330° sweep, gap at the bottom
  const P=(a,r)=>{const t=(a-90)*Math.PI/180;return [C+r*Math.cos(t),C+r*Math.sin(t)];};
  const arc=(a0,a1,r)=>{const [x0,y0]=P(a0,r),[x1,y1]=P(a1,r);return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  const nowA=isT?ang(nowM):(iso(d)<iso(today())?165:-165);
  let ticks='';for(let m=Math.ceil(A0/60)*60;m<=A1;m+=60){const a=ang(m),[x0,y0]=P(a,R+14),[x1,y1]=P(a,R+(m%180===0?20:17));ticks+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" class="dtk${m%180===0?' big':''}"/>`;}
  const lab=(m,txt)=>{const [x,y]=P(ang(m),R+33);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" class="dlab">${txt}</text>`;};
  let dots='';for(const it of its){if(it.quiet||it.id==='wake'||it.id==='sleep')continue;const a=ang(it.m),big=it.type==='meal',[x,y]=P(a,R);const dn=isDone(d,it.id),miss=!dn&&isT&&it.m+90<nowM;
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${big?7:4}" class="dd ${dn?'on':miss?'miss':''} ${big?'meal':''}"><title>${esc(it.title||SLOTL[it.slot]||'')} ${it.t}</title></circle>`;}
  const [hx,hy]=P(nowA,R-22),[tx,ty]=P(nowA,R);

  return `<svg class="dial" viewBox="0 0 300 300" role="img" aria-label="يومك: خلصت ${doneN} من ${total}">
    <defs><radialGradient id="dg" cx="50%" cy="45%" r="60%"><stop offset="0" class="dg0"/><stop offset="1" class="dg1"/></radialGradient></defs>
    <circle cx="150" cy="150" r="${R-26}" fill="url(#dg)"/>
    <path d="${arc(-165,165,R)}" class="dtrack"/>
    ${isT?`<path d="${arc(-165,Math.max(-164.9,nowA),R)}" class="dpast"/>`:''}
    <path d="${arc(-165,165,R-12)}" class="dptrack"/>${prog}
    ${ticks}${lab(A0,'صحيان')}${lab(Math.round((A0+A1)/2/60)*60,min2t(Math.round((A0+A1)/2/60)*60))}${lab(A1,'نوم')}
    ${dots}
    ${isT?`<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="9" class="dnow"/>`:''}
  </svg>`;}

function parseAmt(a){a=String(a);const pm=a.match(/\(([\d.]+)\s*(جم|مل)\)/);if(pm)return [parseFloat(pm[1]),pm[2]==='جم'?'g':'ml'];

  rest=rest.replace(/\(.*?\)/g,' ');for(const [w,u] of UNITS){if(new RegExp('(^|\\s)'+w+'(\\s|$)').test(rest)||rest.startsWith(w)){if(u==='kg')return [n*1000,'g'];if(u==='l')return [n*1000,'ml'];return [n,u];}}

function fmtQty(q){const out=[];const add=(v,u)=>{if(!v)return;if(u==='g')out.push(v>=1000?(Math.round(v/100)/10)+' كجم':Math.round(v)+' جم');else if(u==='ml')out.push(v>=1000?(v/1000).toFixed(1).replace('.0','')+' لتر':Math.round(v)+' مل');

function shopData(from,days){const items={},basics=new Set();

    'فراولة':{cup:['pc',8]},'رغيف بر':{pc:['loaf',1],g:['loaf',1/60]},'حليب قليل الدسم':{tbsp:['ml',15]},'لبن قليل الدسم':{cup:['ml',200]},'جزر':{cup:['pc',1.5]},'فلفل رومي':{cup:['pc',1]},
    'بقسماط':{tbsp:['g',8]},'ذرة':{tbsp:['g',15]},'خبز برجر أسمر':{pc:['loaf',1]}};

const PILLIDS=d=>['p_centrum','p_gluco','p_mag'].concat(d.getDay()===5?['p_vitd']:[]).concat(mjOn(d)?['p_mj']:[]);
function trackStats(n){const t=today();const rows={meals:[],water:[],pills:[],walk:[],sleep:[],steps:[]};
  for(let i=n-1;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);if(sinceStart(d)<0){Object.values(rows).forEach(r=>r.push(null));continue;}const k=iso(d),c=S.checks[k]||{};
    rows.meals.push(['m0','m1','m2','m3','m4'].filter(x=>c[x]).length/5);rows.water.push(Math.min(1,(S.water[k]||0)/12));
    const pl=PILLIDS(d);rows.pills.push(pl.filter(x=>c[x]).length/pl.length);rows.walk.push(c.walk?1:0);
    const h=sleepHours(d);rows.sleep.push(h===null?null:Math.min(1,h/7));const st=S.steps[k];rows.steps.push(st?Math.min(1,st/stepGoal(d)):null);}
  return rows;}
function avgv(a){const v=a.filter(x=>x!==null);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null;}

/* ---------------- PROGRESS ---------------- */
function expected(dayN){ if(dayN<=7) return 116-2.5*(dayN/7); return 113.5-(dayN-7)/7; }
function viewProgress(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
  const last=ws.length?ws[ws.length-1].kg:0, first=ws.length?ws[0].kg:0;
  const has=ws.length>0, lost=+(first-last).toFixed(1), left=has?Math.max(0,+(last-TARGET).toFixed(1)):'—', bmi=has?(last/(HEIGHT*HEIGHT)).toFixed(1):'—';
  // chart
  const Wd=340,H=170,pl=34,pr=10,pt=14,pb=24, days=91;
  const ymax=Math.max(117,...ws.map(w=>w.kg))+0.5, ymin=Math.min(101,...ws.map(w=>w.kg))-0.5;
  const X=dn=>Wd-pr-(dn/days)*(Wd-pl-pr), Y=v=>pt+(ymax-v)/(ymax-ymin)*(H-pt-pb);
  let exp='';for(let dn=0;dn<=days;dn+=7)exp+=(dn?' L':'M')+X(dn).toFixed(1)+' '+Y(expected(dn)).toFixed(1);
  const pts=ws.map(w=>[sinceStart(parse(w.d)),w.kg]).filter(p=>p[0]>=0&&p[0]<=days);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  let grid='';for(let v=Math.ceil(ymin);v<=ymax;v+=4){grid+=`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line2)"/><text x="${pl-6}" y="${Y(v)+4}" style="fill:var(--mut2)" font-size="10" text-anchor="end">${v}</text>`;}
  let xl='';[0,30,60,90].forEach((dn,i)=>{xl+=`<text x="${X(dn)}" y="${H-6}" style="fill:var(--mut2)" font-size="10" text-anchor="middle">${['البداية','شهر 1','شهر 2','شهر 3'][i]}</text>`;});
  const dots=pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" style="fill:var(--gold);stroke:var(--bg)" stroke-width="2"/>`).join('');
  const svg=`<svg class="chart" viewBox="0 0 ${Wd} ${H}">${grid}${xl}<path d="${exp}" style="stroke:var(--ok);opacity:.6" stroke-width="2" stroke-dasharray="5 5" fill="none"/><path d="${line}" style="stroke:var(--gold)" stroke-width="2.5" fill="none"/>${dots}<line x1="${pl}" x2="${Wd-pr}" y1="${Y(TARGET)}" y2="${Y(TARGET)}" style="stroke:var(--gold);opacity:.45" stroke-dasharray="2 4"/><text x="${Wd-pr}" y="${Y(TARGET)-5}" style="fill:var(--gold)" font-size="10" text-anchor="end">الهدف ${TARGET}</text></svg>`;
  // streak
  let streak=0;{const t=today();for(let i=0;i<120;i++){const x=new Date(t);x.setDate(t.getDate()-i);const p=dayProgress(x);if(p.n>=p.t-2)streak++;else if(i>0)break;}}
  const log=ws.slice().reverse().map(w=>`<div class="row"><span class="num">${w.d}</span><span class="num">${w.kg} كجم<button class="del" data-delw="${w.d}">حذف</button></span></div>`).join('');
  return `<div class="sec" style="margin-top:8px"><h2>تقدّمي</h2></div>
  <div class="stats"><div class="stat"><b class="num">${has?last:'—'}</b><span>وزنك الحين</span></div><div class="stat"><b class="num">${lost>0?'−'+lost:lost}</b><span>نزلت (كجم)</span></div><div class="stat"><b class="num">${left}</b><span>باقي للهدف</span></div></div>
  <div class="stats"><div class="stat"><b class="num">${bmi}</b><span>BMI</span></div><div class="stat"><b class="num">${streak}</b><span>أيام ملتزم</span></div><div class="stat"><b class="num">${weekNo(today())}</b><span>أسبوعك</span></div></div>
  ${trackPanel()}
  ${reportPanel()}
  ${badgePanel()}
  ${photoPanel()}
  ${healthPanel()}
  <div class="panel"><h3>الوزن مع الوقت</h3><div class="note" style="margin-top:0">الخط الذهبي وزنك · المتقطع الأخضر المتوقع</div>${svg}
    <div class="wform"><input id="wkg" type="number" inputmode="decimal" step="0.1" min="40" max="250" placeholder="وزنك اليوم (كجم)" aria-label="وزنك اليوم"><button class="btn" id="wadd">سجّل</button></div>
    <div class="note">توزن مرة بالأسبوع، الصبح بعد الحمام وقبل الفطور.</div></div>
  ${sleepStepsStats()}
  <div class="panel wlog"><h3>السجل</h3>${log||'<div class="empty">ما سجلت وزن للحين</div>'}</div>`;
}

  L.push(['salad','اغسل ونشّف خس وخيار وطماط لـ 3 أيام','علبة فيها منديل عشان ما يذبل، والليمون والزيت وقت الأكل']);
  L.push(['snack','جهّز علب السناكات: لوز مقسوم 10 حبات، وجزر وخيار مقطع','تاخذها للدوام بدون تفكير']);
  if([0,1,2,3,4,5,6].some(i=>{const x=new Date(from);x.setDate(x.getDate()+i);return /شوربة عدس|حريرة/.test(dayText(x));})) L.push(['soup','لو بالأسبوع شوربة عدس أو حريرة: اطبخ قدر وقسّمه','تنحفظ 4 أيام، أو فريزر شهر']);

/* ---------------- cooking mode: one step at a time, big type, timers ---------------- */
let cook=null,cookT=null,wakeLock=null;
function stepMinutes(t){const m=t.match(/(\d+)\s*(?:–|-|إلى)?\s*(\d+)?\s*(دقيقة|دقائق|دقايق)/);if(m)return +(m[2]||m[1]);if(/دقيقتين/.test(t))return 2;if(/ربع ساعة/.test(t))return 15;if(/نص ساعة/.test(t))return 30;const h=t.match(/(\d+)\s*ساع/);if(h)return +h[1]*60;if(/ساعة/.test(t))return 60;return 0;}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}}
function cookOpen(link){const r=R[link];if(!r)return;closeSheet();cook={link,i:0,left:0,run:false};try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{});}catch(e){}cookDraw();}
function cookClose(){clearInterval(cookT);cookT=null;cook=null;try{wakeLock&&wakeLock.release();}catch(e){}wakeLock=null;const el=document.getElementById('cook');if(el)el.remove();}
function cookDraw(){if(!cook)return;const r=R[cook.link],st=r.steps[cook.i],n=r.steps.length,mins=stepMinutes(st);let el=document.getElementById('cook');if(!el){el=document.createElement('div');el.id='cook';el.className='cook';document.body.appendChild(el);}
  const mm=Math.floor(cook.left/60),ss=cook.left%60;
  el.innerHTML=`<div class="ck-top"><button class="ck-x" data-cookx="1" aria-label="اقفل">${IC.x}</button><div><b>${esc(r.t)}</b><span class="num">خطوة ${cook.i+1} من ${n}</span></div></div>
   <div class="ck-bar"><i style="width:${(cook.i+1)/n*100}%"></i></div>
   <div class="ck-step">${esc(st)}</div>
   ${mins?`<div class="ck-timer ${cook.run?'on':''}"><b class="num">${cook.left?pad(mm)+':'+pad(ss):pad(mins)+':00'}</b><button data-cooktimer="${mins}">${cook.run?'وقّف':cook.left?'كمّل':'شغّل مؤقت '+mins+' دقيقة'}</button>${cook.left&&!cook.run?'<button data-cookreset="1" class="ghost">صفّر</button>':''}</div>`:''}
   ${cook.i===0?`<details class="ck-ing"><summary>المكونات (${r.ing.length})</summary><ul>${r.ing.map(([a,b])=>`<li><span>${esc(a)}</span><b>${esc(b)}</b></li>`).join('')}</ul></details>`:''}
   <div class="ck-nav"><button data-cookgo="-1" ${cook.i===0?'disabled':''}>السابقة</button><button data-cookgo="1" class="prim">${cook.i===n-1?'خلصت ✓':'التالية'}</button></div>`;}
function cookTimer(mins){if(cook.run){cook.run=false;clearInterval(cookT);cookDraw();return;}if(!cook.left)cook.left=mins*60;cook.run=true;clearInterval(cookT);
  cookT=setInterval(()=>{if(!cook){clearInterval(cookT);return;}cook.left--;if(cook.left<=0){cook.left=0;cook.run=false;clearInterval(cookT);beep();try{navigator.serviceWorker&&navigator.serviceWorker.ready.then(r=>r.showNotification('⏲️ خلص الوقت',{body:R[cook.link].t+' · خطوة '+(cook.i+1),tag:'cook'}));}catch(e){}toast('خلص الوقت ⏲️');}cookDraw();},1000);cookDraw();}

  if(b.id==='wadd'){const v=parseFloat($('#wkg').value);if(!(v>40&&v<250)){toast('اكتب وزن صحيح');return;}const d=iso(today());S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:+v.toFixed(1)});S.checks[d]=S.checks[d]||{};S.checks[d].wt=true;save();render();if($('#sheet').classList.contains('on'))qlSheet('weight');const w=wStats();toast(w&&w.lost>0?`تم ✓ نزلت ${w.lost} كجم (${w.pct}%)`:'تم التسجيل');return;}
  if(b.id==='shX'||b.id==='shX2'){closeSheet();return;}
  if(b.id==='skinBtn'||b.id==='skinBtn2'){const v=document.documentElement.getAttribute('data-skin')==='beige'?'night':'beige';cfg().skin=v;try{localStorage.setItem(SKK,v);}catch(e){}applySkin(v);save();render();toast(v==='beige'?'صار الثيم بيج للكل':'صار الثيم ليلي للكل');return;}
  if(b.id==='enablePush'){enablePush();return;}
  if(b.id==='showCode'){showCode();return;}
  if(ds.missed!==undefined){missedSheet(Number(ds.missed));return;}
  if(ds.pill){pillSheet(ds.pill);return;}
  if(ds.ql){qlSheet(ds.ql);return;}
  if(b.id==='wakeReset'){const k=iso(sel);if(S.sleep[k]){delete S.sleep[k].wake;}save();render();qlSheet('day');toast('رجع للبداية الافتراضية');return;}
  if(b.id==='mjOn'){const m=mjCfg();cfg().mj=Object.assign(m,{on:m.on?'':'1',from:m.from||iso(today())});save();render();go('plan','ppills');toast(cfg().mj.on?'انضافت الإبرة لجدولك':'انشالت من الجدول');return;}
  if(b.id==='lkNew'){unlock(window.__pendingPw||($('#lkPw')||{}).value,true);return;}
  if(b.id==='fbLeave'){fbLeave();return;}
  if(b.id==='fbSyncNow'){fbPush().then(()=>toast(fbErr?'ما فيه اتصال':'تحدّث ✓'));return;}
  if(b.id==='shareBtn3'){shareSheet();return;}
  if(b.id==='shareBtn'||b.id==='shareBtn2'){shareSheet();return;}
  if(b.id==='copyLink'){const t=$('#slink');try{navigator.clipboard.writeText(t.value).then(()=>toast('انسخ ✓'),()=>{t.select();toast('حدد الرابط وانسخه');});}catch(e){t.select();}return;}
  if(b.id==='nativeShare'){navigator.share({title:'خطتي للوزن',text:'هذي خطتي للأكل، وفيها وجبات كل يوم وطريقتها وقائمة المشتريات:',url:shareURL()}).catch(()=>{});return;}
  if(b.id==='copySt'){const t=$('#stURL');try{navigator.clipboard.writeText(t.value).then(()=>toast('انسخ ✓'),()=>{t.select();toast('حدد الرابط وانسخه');});}catch(e){t.select();}return;}
  if(b.id==='copyCode'){const t=$('#pcode');try{navigator.clipboard.writeText(t.value).then(()=>toast('انسخ ✓'),()=>{t.select();toast('حدد الرمز وانسخه');});}catch(e){t.select();}return;}
  if(b.id==='localTest'){navigator.serviceWorker.ready.then(r=>r.showNotification('🔔 تجربة',{body:'هذا شكل التذكير',icon:'icon-192.png',lang:'ar',dir:'rtl'})).catch(()=>toast('ما زبط'));return;}
  if(b.id==='testPush'){fetch('/api/test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({endpoint:pushEp})}).then(r=>toast(r.ok?'انرسل، شيّك إشعاراتك':'ما انرسل')).catch(()=>toast('ما انرسل'));return;}
  if(ds.ncat){S.notif[ds.ncat]=S.notif[ds.ncat]?0:1;save();render();go('plan','pnotif');return;}
  if(b.id==='resetToday'){delete S.checks[iso(sel)];delete S.water[iso(sel)];save();render();toast('انمسحت');return;}
  if(b.id==='resetSwaps'){S.swaps={};save();render();toast('رجعت الوجبات الأصلية');return;}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('submit',e=>{if(e.target.id==='lkForm'){e.preventDefault();unlock($('#lkPw').value,false);}});
document.addEventListener('input',e=>{if(e.target.id==='rq'){rQuery=e.target.value;const pos=e.target.selectionStart;render();const i=$('#rq');i.focus();i.setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='phIn'&&e.target.files&&e.target.files[0]){shrink(e.target.files[0]).then(u=>photoPut({d:iso(today()),u})).then(()=>{loadPhotos();toast('انحفظت الصورة');}).catch(()=>toast('ما زبطت الصورة'));return;}
  if(id==='lbT'){const w=$('#lbNewW');if(w)w.style.display=e.target.value==='__new'?'block':'none';return;}
  const refresh=()=>{save();render();if(sheetFn&&$('#sheet').classList.contains('on'))sheetFn();};
  if(id==='slBed'||id==='slWake'){const k=iso(sel);S.sleep[k]=Object.assign({},S.sleep[k]||{});S.sleep[k][id==='slBed'?'bed':'wake']=e.target.value;refresh();return;}
  if(id==='stIn'){const v=parseInt(e.target.value,10);const k=iso(sel);if(v>0&&v<100000)S.steps[k]=v;else delete S.steps[k];refresh();return;}
  if(id==='dayStart'&&e.target.value){cfg().dayStart=e.target.value;refresh();toast('صار يومك يبدأ '+min2t(hm2min(e.target.value)));return;}
  if(id==='wDay'){cfg().weighDay=e.target.value;refresh();toast('يوم الوزن: '+MJDAYS[+e.target.value]);return;}
  if(id==='mjDay'||id==='mjDose'||id==='mjFrom'){const m=mjCfg();m[{mjDay:'day',mjDose:'dose',mjFrom:'from'}[id]]=e.target.value;cfg().mj=m;save();render();go('plan','ppills');return;}if(e.target.id==='startd'&&e.target.value){S.start=e.target.value;save();sel=today();render();if(sheetFn&&$('#sheet').classList.contains('on'))sheetFn();toast('الخطة تبدأ '+fmtDate(parse(S.start)));}});
window.__wp={buildSched,shopData,fmtQty,weighDue};
if(window.__sharedOpen){tab='week';}
setTimeout(()=>{try{pushSched();}catch(e){}},2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){try{pushSched();}catch(e){}}});
render();
if(window.__sharedOpen)toast('انفتحت الخطة المشتركة');
setInterval(()=>{if(tab==='today'&&!$('#sheet').classList.contains('on'))render();},60000);
})();
</script>
</body></html>
