<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ميزانيتي</title>
<meta name="description" content="إدارة الدخل والالتزامات والادخار بوضوح">
<meta name="theme-color" content="#0b1322">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ميزانيتي">
<link rel="stylesheet" href="style.css?v=1792517622151">
<link rel="stylesheet" href="ui.css?v=1792517622151">
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="mark">م</div>
    <h1>ميزانيتي</h1>
    <p class="lead">إدارة الدخل والالتزامات والادخار بوضوح</p>
    <div id="authCard">
      <div class="field"><label>اسم المستخدم</label><input id="lUser" value="admin" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="lPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <div class="field"><label>المظهر</label><div class="themes" id="loginThemes"></div></div>
      <button class="btn-main wide" onclick="login()">دخول</button>
      <div id="lErr" class="note n-red hidden" style="margin:14px 0 0"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <nav id="nav" class="hidden" aria-hidden="true"></nav>
  <header class="appbar">
    <div class="ab-brand" onclick="go('dash')"><span class="ab-mark">م</span><span class="ab-name">ميزانيتي</span></div>
    <div class="ab-title"><h2 id="ttl">الرئيسية</h2><p id="sub"></p></div>
    <div class="ab-acts">
      <select class="sel" id="monthSel" onchange="setMonth(this.value)" aria-label="الدورة"></select>
      <button class="ab-btn" id="topBtn" onclick="topAction()">إضافة</button>
      <button class="ab-ico" onclick="refresh(true)" aria-label="تحديث" id="abRefresh"></button>
    </div>
  </header>
  <main class="main">
    <div id="err" class="note n-red hidden" style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <span id="errTxt"></span><button class="x" onclick="hideErr()">×</button></div>
    <section id="view"></section>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="sheetBg" class="sheet-bg hidden" onclick="closeSheet()"><div id="sheet" class="sheet" onclick="event.stopPropagation()"></div></div>
<div id="mbg" class="mbg hidden" onclick="closeModal(event)"><div id="modal" class="modal" onclick="event.stopPropagation()"></div></div>
<div id="load" class="hidden"><div class="loader"><div class="spin"></div><div id="loadTxt">جاري التحميل…</div></div></div>
<div id="toast" class="toast"></div>
<div id="installBar" class="installbar hidden">
  <span>ثبّت ميزانيتي على جهازك لتفتح كتطبيق وتصلك الإشعارات</span>
  <button class="btn-sm" onclick="doInstall()">تثبيت</button>
  <button class="x" onclick="el('installBar').classList.add('hidden')">×</button>
</div>

<script src="bridge.js?v=1792517622151"></script>
<script src="sync.js?v=1792517622151"></script>
<script src="app.js?v=1792517622151"></script>
<script src="ui.js?v=1792517622151"></script>
<script src="main.js?v=1792517622151"></script>
</html>
